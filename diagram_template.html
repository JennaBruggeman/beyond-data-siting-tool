<meta charset="utf-8">
<title>Beyond Data Tool Logic</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600&display=swap">
<style>
/* Workbench: graph canvas (pan/zoom) left, inspector right; stacks on phones. Dark-only by decision (J.B., 9 Oct). */
:root{
  color-scheme:dark;
  --bg:#17181a; --panel:#1e2023; --panel-2:#24272b; --line:#30343a; --line-2:#3c4148;
  --fg:#e9e6e1; --muted:#9d9a94; --faint:#6b6964;
  --accent:#CC746C; --accent-2:#e39a93;
  --k-input:#8aa3bd; --k-place:#86ada7; --k-condition:#cdb07a; --k-opp:#a99bc9; --k-party:#e9e6e1;
  --ok:#8fb996; --mid:#CC746C; --bad:#b24f49; --na:#6b6964;
  --font:"Open Sans",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:300 14px/1.5 var(--font);overflow:hidden}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
.app{display:grid;grid-template-rows:auto 1fr;height:100%}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:15px;font-weight:600;letter-spacing:.02em;margin:0;white-space:nowrap}
header h1 span{font-weight:300;color:var(--muted);margin-left:8px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;overflow:hidden}
.seg button{background:transparent;border:0;padding:5px 12px;cursor:pointer;color:var(--muted);font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:#1a1212;font-weight:600}
.seg button:focus-visible,.tb button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent-2);outline-offset:1px}
header input[type=search]{background:var(--bg);border:1px solid var(--line-2);border-radius:6px;padding:5px 10px;min-width:180px}
header select{background:var(--bg);border:1px solid var(--line-2);border-radius:6px;padding:5px 8px}
.tb{display:inline-flex;gap:4px;margin-left:auto}
.tb button{background:var(--panel-2);border:1px solid var(--line-2);border-radius:6px;width:30px;height:30px;cursor:pointer;color:var(--fg)}
.tb button:hover{border-color:var(--accent)}
main{display:grid;grid-template-columns:1fr var(--aw,460px);min-height:0;position:relative}
#canvas{position:relative;overflow:hidden;background:var(--bg);cursor:grab;min-width:0}
#canvas.drag{cursor:grabbing}
#canvas svg{width:100%;height:100%;display:block}
.stage-label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;fill:var(--muted);font-weight:600}
.stage-desc{font-size:11px;fill:var(--faint)}
.stage-rule{stroke:var(--line);stroke-width:1}
.band-label{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.wire{fill:none;stroke:#4a5058;stroke-width:1.2;opacity:.9}
.wire.up{stroke:var(--accent);opacity:1;stroke-width:1.6}
.wire.down{stroke:var(--k-condition);opacity:1;stroke-width:1.4}
.wire.cond{stroke:var(--k-condition);opacity:.9;stroke-width:1.1}
.wire.party{stroke:var(--k-party);opacity:.85;stroke-width:1.1}
.wire.value{stroke:var(--accent);stroke-dasharray:4 4;opacity:.9}
.wire.addon{stroke:#d8c9a3;stroke-dasharray:2 3;opacity:.9}
.node .plus{font-size:10px;fill:#d8c9a3;font-weight:600}
.addl{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:10px}
.addl li{border:1px solid var(--line-2);border-radius:6px;padding:8px 10px;font-size:12.5px}
.addl li b{font-weight:600;font-size:13px}
.addl .st{float:right;font-size:11px;border:1px solid var(--line-2);border-radius:999px;padding:0 7px;color:var(--muted)}
.addl .st.excluded{color:var(--faint)} .addl .st.sized{color:var(--ok);border-color:var(--ok)} .addl .st.gate{color:var(--accent-2);border-color:var(--accent)}
.addl .r{color:var(--muted);margin-top:4px}
.wire.dim{opacity:.12}
.node{cursor:pointer}
.node rect.box{fill:var(--panel);stroke:var(--fc,var(--line-2));stroke-width:1;rx:5}
.node:hover rect.box{stroke:var(--fg)}
.node.sel rect.box{stroke:var(--accent);stroke-width:1.6}
.node.dim{opacity:.22}
.node.hit rect.box{stroke:var(--accent-2)}
.node.gap rect.box{stroke-dasharray:4 3}
.node text.name{font-size:12px;fill:var(--fg);font-weight:400}
.node text.unit{font-size:10px;fill:var(--muted)}
.node text.val{font-size:10.5px;fill:var(--accent-2);font-weight:400}
.node.input:not(.fam) rect.box{stroke:var(--k-input)}
.node.input.place:not(.fam) rect.box{stroke:var(--k-place)}
.ficon{fill:none;stroke:var(--fc);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.node .side{fill:var(--k-place)}
.node.party rect.box{stroke:var(--k-party);fill:var(--panel-2)}
.node.gen rect.box{stroke:var(--fg);stroke-width:1.4;fill:var(--panel-2)}
.node.pref rect.box{stroke:var(--accent);stroke-dasharray:5 3}
.port{fill:var(--bg);stroke:var(--line-2);stroke-width:1}
.node.sel .port,.node:hover .port{stroke:var(--fg)}
.ring-track{fill:none;stroke:var(--line-2);stroke-width:2.6}
.ring-fill{fill:none;stroke:var(--accent);stroke-width:2.6;stroke-linecap:butt}
.glyph{fill:none;stroke:var(--muted);stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.cond{cursor:pointer}
.cond rect.box{fill:var(--panel);stroke:var(--line);rx:4}
.cond:hover rect.box,.cond.sel rect.box{stroke:var(--k-condition)}
.cond.dim{opacity:.22}
.cond text{font-size:11px;fill:var(--fg)}
.cond text.mv{font-size:10px;fill:var(--muted)}
.cond.constraint text.mv{fill:var(--accent-2)}
.cond .stripe{fill:var(--line-2)}
.cond.pass .stripe{fill:var(--ok)} .cond.partial .stripe{fill:var(--mid)} .cond.fail .stripe{fill:var(--bad)} .cond.unassessed .stripe{fill:var(--na)} .cond.na .stripe{fill:var(--line)} .cond.cannot .stripe{fill:var(--k-input)}
.hband{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;fill:var(--k-condition);font-weight:600}
.hband.oband{fill:var(--k-opp)}
.hband.oband:hover{fill:var(--fg)}
.life rect.seg{fill:var(--panel);stroke:var(--line-2);rx:4;cursor:pointer}
.life g:hover rect.seg,.life g.sel rect.seg{stroke:var(--accent)}
.life text{font-size:11px;fill:var(--fg)}
.life text.y{font-size:10px;fill:var(--muted)}
aside{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:16px 18px 32px;min-width:0}
aside h2{font-size:16px;font-weight:600;margin:0 0 2px}
aside .kind{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
aside dl{margin:14px 0 0;display:grid;grid-template-columns:92px 1fr;gap:8px 12px;font-size:13px}
aside dt{color:var(--muted)}
aside dd{margin:0;min-width:0;overflow-wrap:anywhere}
aside code{font-family:var(--mono);font-size:12px;background:var(--bg);padding:1px 5px;border-radius:4px}
aside details summary{cursor:pointer;color:var(--muted);font-size:12.5px}
aside details p{margin:6px 0 0;font-size:12.5px}
aside .chip{display:inline-block;border:1px solid var(--line-2);border-radius:999px;padding:1px 9px;font-size:12px;margin:2px 4px 2px 0;cursor:pointer;background:var(--bg)}
aside .chip:hover{border-color:var(--accent)}
aside .chip.c{border-color:var(--k-condition)} aside .chip.o{border-color:var(--k-opp)} aside .chip.i{border-color:var(--k-input)} aside .chip.p{border-color:var(--k-party)}
aside .tag{display:inline-block;border:1px solid var(--line-2);border-radius:3px;padding:0 6px;font-size:11.5px;margin:2px 4px 2px 0;color:var(--muted)}
aside .tag.hard{border-color:var(--accent);color:var(--accent-2)}
.roles{display:flex;flex-direction:column;gap:6px}
.role{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:start;font-size:12.5px}
.role b{font-weight:400;color:var(--fg)}
.role span{color:var(--muted);font-size:12px}
.role em{color:var(--accent-2);font-style:normal}
.rconf{display:inline-block;text-align:center;border:1px solid var(--line-2);border-radius:4px;font-size:11px;padding:1px 0;color:var(--muted);font-variant-numeric:tabular-nums}
.confrow{display:flex;align-items:center;gap:10px;margin-top:12px}
.confrow svg{flex:none}
.confrow b{font-weight:600}
.confrow small{color:var(--muted)}
.val{margin-top:12px;padding:10px 12px;border-left:3px solid var(--accent);background:var(--bg);border-radius:0 6px 6px 0}
.val b{display:block;font-weight:600;color:var(--accent-2)}
.val span{color:var(--muted);font-size:12.5px}
.empty p{color:var(--muted);margin:10px 0}
.draft{color:var(--accent-2)}
.draftnote{font-size:11.5px;color:var(--faint);margin-top:4px}
.key{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;font-size:12.5px;margin-top:14px}
.key i{display:inline-block;width:11px;height:11px;border-radius:50%;border:1.5px solid}
.srcs li{margin:4px 0;font-size:12.5px;overflow-wrap:anywhere}
.srcs{padding-left:18px;margin:6px 0 0}
.srcs a{color:var(--accent-2)}
.box2{margin-top:14px;padding:12px;border:1px solid var(--line-2);border-radius:8px}
.box2 b{font-weight:600}
.steps{padding-left:18px;margin:8px 0 0;font-size:13px}
.steps li{margin:4px 0}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:11.5px;font-weight:600;color:#161616}
.pill.pass{background:var(--ok)} .pill.partial{background:var(--mid)} .pill.fail{background:var(--bad)} .pill.unassessed,.pill.na{background:var(--line-2);color:var(--fg)} .pill.cannot{background:var(--k-input)}
#tip{position:absolute;pointer-events:none;background:var(--panel-2);border:1px solid var(--line-2);border-radius:6px;padding:6px 9px;font-size:12px;max-width:280px;display:none;z-index:3}
[hidden]{display:none!important}
#resizer{position:absolute;top:0;bottom:0;width:9px;cursor:col-resize;z-index:4;right:calc(var(--aw,460px) - 4px)}
#resizer::after{content:"";position:absolute;left:4px;top:0;bottom:0;width:1px;background:transparent}
#resizer:hover::after,#resizer.drag::after{background:var(--accent)}
main.full #resizer{display:none}
.mech.zoomable{cursor:zoom-in}
.mech .zh{font-size:11px;color:var(--faint)}
#zoom{position:fixed;inset:0;z-index:20;background:rgba(10,10,11,.86);display:grid;place-items:center;padding:24px 16px}
#zoom .zb{background:var(--panel);border:1px solid var(--line-2);border-radius:10px;width:min(1180px,100%);max-height:100%;overflow:auto;padding:16px 20px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px}
#zoom .zd svg{width:100%;height:auto;display:block}
#zoom .zt{display:flex;align-items:center;gap:10px;grid-column:1/-1} #zoom .zt b{font-size:16px;font-weight:600} #zoom .zt button{margin-left:auto;background:var(--panel-2);border:1px solid var(--line-2);color:var(--fg);border-radius:6px;padding:4px 12px;cursor:pointer}
#zoom ol{list-style:none;padding:0;margin:0;font-size:13px} #zoom li{margin:0 0 8px;cursor:pointer} #zoom li.on{color:var(--accent-2)} #zoom li em{font-style:normal;color:var(--faint);font-size:11.5px}
#zoom li.on .gn{background:var(--accent);border-color:var(--accent);color:#17181a}
@media (max-width:900px){#resizer{display:none} #zoom .zb{grid-template-columns:1fr}}

/* family diagrams, side panel and Guide */
.ctag.on .ld{stroke:var(--accent)} .ctag.on .dot{fill:var(--accent)} .ctag.on .tg{fill:var(--accent);stroke:var(--accent)} .ctag.on text{fill:#17181a}
.mech{margin:14px 0 0;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px}
.mech svg{width:100%;height:auto;display:block} .mech figcaption{font-size:11.5px;color:var(--faint);margin-top:4px;display:flex;justify-content:space-between;gap:8px}
.mech a,.glink{color:var(--accent-2);cursor:pointer;text-decoration:none} .mech a:hover,.glink:hover{text-decoration:underline}
.why{margin:10px 0 0;font-size:13px}
.famk{display:flex;align-items:center;gap:6px}
#guidev{overflow:hidden;background:var(--bg);min-width:0;min-height:0}
main.full{grid-template-columns:1fr} main.full aside{display:none}
.gwrap{display:grid;grid-template-columns:230px minmax(0,1fr) 340px;height:100%}
.gwrap>*{overflow:auto;min-height:0}
.gnav{border-right:1px solid var(--line);padding:14px 10px;background:var(--panel)}
.gnav h3{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:14px 6px 4px;display:flex;align-items:center;gap:8px}
.gnav h3 i{display:inline-block;width:18px;height:3px;border-radius:2px}
.gnav button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;border-radius:5px;padding:5px 8px;color:var(--muted);font-size:13px;cursor:pointer}
.gnav button:hover{color:var(--fg)} .gnav button[aria-current="true"]{background:var(--panel-2);color:var(--fg)}
.gnav button em{font-style:normal;margin-left:auto;color:var(--faint);font-size:11.5px}
.gmain{padding:18px 22px 40px;min-width:0}
.gmain h2{font-size:18px;font-weight:600;margin:4px 0 2px;display:flex;align-items:center;gap:10px}
.gmain .gk{font-size:11px;border:1px solid var(--line-2);border-radius:999px;padding:1px 9px;color:var(--muted);font-weight:300;margin-left:auto}
.gmain .mech{padding:12px;max-width:900px}
.gmain .cap{max-width:72ch;font-size:13.5px;margin:10px 0 0}
.gside{border-left:1px solid var(--line);padding:16px 18px 40px;background:var(--panel);min-width:0}
.gside ol{list-style:none;padding:0;margin:10px 0 0}
.gside li{margin:0 0 12px;font-size:13px;cursor:pointer;border-radius:6px;padding:6px 8px;margin-left:-8px}
.gside li:hover{background:var(--panel-2)} .gside li.on{background:var(--panel-2);outline:1px solid var(--accent)}
.gside li b{font-weight:400} .gside li em{font-style:normal;color:var(--faint);font-size:11.5px}
.gn{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1px solid var(--line-2);font-size:10.5px;font-weight:600;margin-right:7px;vertical-align:1px}
.gside li.on .gn{background:var(--accent);border-color:var(--accent);color:#17181a}
.gside .glink{font-size:12px;margin-left:25px}
.parts{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:12px;max-width:760px}
.parts li{display:grid;grid-template-columns:28px 1fr;gap:4px 10px;font-size:13.5px} .parts b{font-weight:600}
@media (max-width:1100px){#guidev{overflow:auto} .gwrap{height:auto} .gwrap>*{overflow:visible} .gwrap{grid-template-columns:200px minmax(0,1fr)} .gside{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}}
@media (max-width:900px){main.full{grid-template-rows:1fr}}
@media (max-width:700px){.gwrap{grid-template-columns:1fr} .gnav{border-right:0;border-bottom:1px solid var(--line)}}

/* user workflow view */
#flow{overflow:auto;background:var(--bg);min-width:0;padding:8px 0 24px}
#flow svg{display:block}
#flow .lane{fill:var(--panel);fill-opacity:.35;stroke:var(--line);rx:8}
.fwire{fill:none;stroke:#59606a;stroke-width:1.2}
.fwire.loop{stroke:var(--accent);stroke-dasharray:5 4;stroke-width:1.3}
.fwire.hi{stroke:var(--fg);stroke-width:1.8}
.fwire.loop.hi{stroke:var(--accent-2)}
.flabel{font-size:10.5px;fill:var(--muted)}
.flabel.loop{fill:var(--accent-2)}
.fnode{cursor:pointer;outline:none}
.fnode .shape{fill:var(--panel);stroke:var(--fg);stroke-width:1}
.fnode.decision .shape{stroke:var(--accent);stroke-width:1.3}
.fnode.tool .shape{fill:var(--panel-2);stroke:var(--line-2)}
.fnode.output .shape{stroke:var(--k-opp)}
.fnode:hover .shape,.fnode:focus-visible .shape{stroke-width:2}
.fnode.sel .shape{stroke:var(--accent-2);stroke-width:2}
.fkind{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;fill:var(--faint);font-weight:600}
.ftitle{font-size:13px;fill:var(--fg);font-weight:400}
.fsub{font-size:10.5px;fill:var(--muted)}
.fbar{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 16px;background:var(--bg);border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.fbar .fnote{color:var(--faint)}
.fneed{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;fill:var(--faint)}
.fneed.required{fill:var(--accent-2)} .fneed.auto{fill:var(--k-place)} .fneed.expert{fill:var(--k-input)}
.fnode.need-required .shape{stroke-width:2}
.fnode.need-optional .shape,.fnode.need-expert .shape{stroke-dasharray:5 4}
#flow.quick .fnode.need-expert{opacity:.18}
#flow.quick .fwire.xp{opacity:.15}
.needpill{display:inline-block;border:1px solid var(--line-2);border-radius:999px;padding:0 8px;font-size:11px;color:var(--muted);white-space:nowrap}
.needpill.required{border-color:var(--accent);color:var(--accent-2)} .needpill.auto{border-color:var(--k-place);color:var(--k-place)} .needpill.expert{border-color:var(--k-input);color:var(--k-input)}
.view button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
@media (max-width:900px){
  main{grid-template-columns:1fr;grid-template-rows:55% 45%}
  aside{border-left:0;border-top:1px solid var(--line)}
  body{overflow:auto}
}
@media (prefers-reduced-motion:no-preference){ .node rect.box,.wire,.cond rect.box{transition:opacity .15s,stroke .15s} }
</style>

<div class="app">
<header>
  <h1>Beyond Data <span>tool logic</span></h1>
  <div class="seg view" role="group" aria-label="View">
    <button id="v-logic" aria-pressed="true">Tool logic</button>
    <button id="v-flow" aria-pressed="false">User workflow</button>
    <button id="v-guide" aria-pressed="false">Guide</button>
  </div>
  <div class="seg logic-only" role="group" aria-label="Mode">
    <button id="m-structure" aria-pressed="true">Structure</button>
    <button id="m-example" aria-pressed="false">Worked example</button>
  </div>
  <input id="q" class="logic-only" type="search" placeholder="Find a quantity, condition, party or source" aria-label="Search">
  <select id="heading" class="logic-only" aria-label="Filter conditions by heading"><option value="">All headings</option></select>
  <div class="tb logic-only">
    <button id="z-in" title="Zoom in" aria-label="Zoom in">+</button>
    <button id="z-out" title="Zoom out" aria-label="Zoom out">−</button>
    <button id="z-fit" title="Show everything" aria-label="Show everything">⌂</button>
  </div>
</header>
<main>
  <div id="canvas"><svg id="svg" role="img" aria-label="Tool logic: what the data centre brings and what the place offers feed quantities across process stages; conditions say what it would take to move each; the user's count, limits and emphasis shape a set of options; each option's trade-off table fans out to the parties who gain and give up; a lifecycle strip runs underneath."></svg><div id="tip"></div></div>
  <div id="flow" hidden></div>
  <div id="guidev" hidden></div>
  <div id="resizer" role="separator" aria-orientation="vertical" aria-label="Resize the side panel" tabindex="0"></div>
  <aside id="inspector"></aside>
</main>
</div>

<script type="application/json" id="data">/*DATA*/</script>
<script type="application/json" id="guide">/*GUIDE*/</script>
<script>
(function(){
const D=JSON.parse(document.getElementById('data').textContent);
const G=JSON.parse(document.getElementById('guide').textContent); window.__G=G;
// synthetic nodes: options generator, preferences, parties
const OL=D.options_logic||{steps:[],preferences:[]};
D.nodes.push({id:'gen',kind:'gen',stage:'options',name:'Options',unit:'set, in no order',formula:'',inputs:[],conf:null});
D.nodes.push({id:'relax',kind:'gen',stage:'options',name:'If you moved a limit',unit:'shown separately',formula:'',inputs:[],conf:null});
D.nodes.push({id:'addons',kind:'gen',stage:'options',name:'What if we added…',unit:(D.try_menu||[]).length+' things to try on an option',formula:'',inputs:[],conf:null});
OL.preferences.forEach(p=>D.nodes.push({id:p.id,kind:'pref',stage:'options',name:p.name,unit:'set by the user',formula:p.note,inputs:[],conf:null}));
(D.parties||[]).forEach(p=>D.nodes.push({id:'party_'+p.id,kind:'party',stage:'parties',name:p.name,unit:p.note,formula:p.note,inputs:[],conf:null,pid:p.id}));
const N={}; D.nodes.forEach(n=>N[n.id]=n);
const C={}; D.conditions.forEach(c=>C[c.id]=c);
const MC={}; (D.move_categories||[]).forEach(m=>MC[m.id]=m);
const LIFE=D.lifecycle||[];
const svg=document.getElementById('svg'), canvas=document.getElementById('canvas'), insp=document.getElementById('inspector'), tip=document.getElementById('tip');
const NS='http://www.w3.org/2000/svg';

let mode='structure', selected=null, hfilter='', query='';

/* ---------- layout ---------- */
const NW=176, NH=46, NHX=60, GAP=12, COLGAP=92, TOP=70, CW=320;
const stageIds=['input','size','place','characterise','prospect','opportunity','test','conds','options','decide','parties'];

D.nodes.forEach(n=>{ (cols[n.stage]||(cols[n.stage]=[])).push(n); });
D.opportunities.forEach((o,i)=>{o.id='opp_'+i; o.kind='opp';});
const oppOf={}; D.opportunities.forEach(o=>o.quantities.forEach(q=>{ if(N[q]&&N[q].stage==='opportunity'&&!oppOf[q]) oppOf[q]=o.id; }));
const OGROUPS=D.opportunities.map(o=>({o, qs:cols.opportunity.filter(n=>oppOf[n.id]===o.id)})).filter(g=>g.qs.length);
const rest=cols.opportunity.filter(n=>!oppOf[n.id]); if(rest.length) OGROUPS.push({o:{id:'opp_other',name:'Other',quantities:rest.map(n=>n.id)},qs:rest});
const colX={}; let x=24; stageIds.forEach(s=>{colX[s]=x; x+= (s==='conds'?CW:NW)+COLGAP;}); const TOTALW=x;
const posN={};
function nh(){return mode==='example'?NHX:NH}
const inputsOf=n=>(n.inputs||[]);
function order(){
  const seq=['input','size','place','characterise','prospect','test'];
  let y0={};
  seq.forEach((s,si)=>{
    const arr=cols[s];
    if(si>0){ arr.forEach(n=>{const ins=inputsOf(n).filter(i=>y0[i]!=null); n._b=ins.length?ins.reduce((a,i)=>a+y0[i],0)/ins.length:1e9;}); arr.sort((a,b)=>a._b-b._b||a.name.localeCompare(b.name)); }
    else arr.sort((a,b)=>(a.side==='dc'?0:1)-(b.side==='dc'?0:1));
    arr.forEach((n,i)=>y0[n.id]=i);
  });
  for(let si=seq.length-2;si>=1;si--){
    const s=seq[si], arr=cols[s];
    const kids={}; seq.slice(si+1).forEach(t=>cols[t].forEach(n=>inputsOf(n).forEach(i=>{(kids[i]=kids[i]||[]).push(y0[n.id]);})));
    arr.forEach(n=>{const k=kids[n.id]; n._b=k&&k.length? (k.reduce((a,b)=>a+b,0)/k.length)*0.6+y0[n.id]*0.4 : y0[n.id];});

let condPos={}, HROWS=[], OROWS=[], IBANDS=[], LIFEPOS=[], TOTALH=0, LIFEY=0;
function layout(){
  order();
  const h=nh(); let maxY=0;
  // inputs: two bands
  { let y=TOP; IBANDS=[];
    [['dc','The data centre brings','var(--k-input)'],['place','The place offers','var(--k-place)']].forEach(([side,label,col])=>{ const list=cols.input.filter(n=>(n.side||'place')===side); if(!list.length)return; IBANDS.push({label,col,y}); y+=20; list.forEach(n=>{posN[n.id]={x:colX.input,y,w:NW,h}; y+=h+GAP;}); y+=12; });
    maxY=Math.max(maxY,y); }
  ['size','place','characterise','prospect','test'].forEach(s=>{ let y=TOP; cols[s].forEach(n=>{posN[n.id]={x:colX[s],y,w:NW,h}; y+=h+GAP;}); maxY=Math.max(maxY,y); });
  OROWS=[]; { let y=TOP; OGROUPS.forEach(g=>{ OROWS.push({g,y}); y+=20; g.qs.forEach(n=>{posN[n.id]={x:colX.opportunity,y,w:NW,h}; y+=h+GAP;}); y+=10; }); maxY=Math.max(maxY,y); }
  let y=TOP; HROWS=[]; const CH=26;
  D.headings.forEach(hd=>{ const list=D.conditions.filter(c=>c.heading===hd); if(!list.length)return; HROWS.push({h:hd,y}); y+=20; list.forEach(c=>{condPos[c.id]={x:colX.conds,y,w:CW,h:CH}; y+=CH+5;}); y+=12; });
  maxY=Math.max(maxY,y);
  const mid=TOP+(y-TOP)*0.42;
  // options column: generator, relax, then preferences below (values enter from below)
  posN.gen={x:colX.options,y:mid-40,w:NW,h:64};
  posN.relax={x:colX.options,y:mid+40,w:NW,h:NH};
  posN.addons={x:colX.options,y:mid-150,w:NW,h:64};
  let py=mid+150; OL.preferences.forEach(p=>{posN[p.id]={x:colX.options,y:py,w:NW,h:NH}; py+=NH+GAP;});
  // account column around the generator
  const acc=cols.decide.slice().sort((a,b)=>(a.id==='tradeoffs'?0:1)-(b.id==='tradeoffs'?0:1)); let ay=mid-40; acc.forEach(n=>{posN[n.id]={x:colX.decide,y:ay,w:NW,h:n.id==='tradeoffs'?64:h}; ay+=(n.id==='tradeoffs'?64:h)+GAP*2;});
  // parties
  const P=cols.parties; let ppy=mid-((P.length*(NH+GAP))/2)+20; P.forEach(n=>{posN[n.id]={x:colX.parties,y:ppy,w:NW,h:NH}; ppy+=NH+GAP;});
  maxY=Math.max(maxY,py,ppy);
  // lifecycle strip
  LIFEY=maxY+60; const x0=colX.size, x1=colX.parties+NW, sw=(x1-x0)/Math.max(1,LIFE.length);
  LIFEPOS=LIFE.map((ph,i)=>({ph,x:x0+i*sw+3,y:LIFEY+26,w:sw-6,h:62}));
  TOTALH=LIFEY+130;
}

/* ---------- drawing ---------- */
const root=el('g',{id:'root'},svg);
const gWires=el('g',{id:'wires'},root), gHi=el('g',{id:'hi'},root), gStages=el('g',{},root), gNodes=el('g',{},root), gConds=el('g',{},root), gLife=el('g',{class:'life'},root);

const glyphs={
  input:'M4 2 H1 V12 H4 M9 2 H12 V12 H9',
  quantity:'M2 2 H11 L6 7 L11 12 H2',
  decide:'M1 3 H12 M1 7 H12 M1 11 H8',
  gen:'M1 2 H12 L8 7 V12 L5 10 V7 Z',

function ring(g,cx,cy,conf,r=9){ el('circle',{class:'ring-track',cx,cy,r},g); if(conf>0) el('path',{class:'ring-fill',d:arc(cx,cy,r,conf/100)},g); }

    el('path',{class:'glyph',d:glyphs[kind==='quantity'&&n.stage==='decide'?'decide':kind]||glyphs.quantity,transform:`translate(${n.conf!=null?13.5:12},${cy-4.5}) scale(0.7)`},g); }

  g.addEventListener('click',e=>{e.stopPropagation();if(moved){moved=false;return;}select(n.id)});

function oppConf(o){return Math.min(...o.quantities.map(q=>N[q]&&N[q].upstream!=null?N[q].upstream:100))}
const moveShort={choice:'option',money:'money',time:'time',policy:'policy',infra:'infra',physics:'not movable'};
function drawCond(c){

function weakest(c){return Math.min(...c.quantities.map(q=>N[q]&&N[q].upstream!=null?N[q].upstream:100))}
function condState(c){ return D.example.conditions[c.id]||'unassessed'; }

function drawLife(){

function drawAll(){
  [gWires,gStages,gNodes,gConds,gLife,gHi].forEach(g=>g.innerHTML='');

/* ---------- pan / zoom ---------- */
let vb={x:0,y:0,w:TOTALW,h:TOTALH};
function setVB(){svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`)}
function fit(){ const cw=canvas.clientWidth, ch=canvas.clientHeight; const s=Math.max(TOTALW/cw,TOTALH/ch); vb={x:0,y:0,w:cw*s,h:ch*s}; setVB(); }
function oneToOne(){ const cw=canvas.clientWidth, ch=canvas.clientHeight; vb={x:0,y:0,w:cw,h:ch}; setVB(); }
function zoom(f,cx,cy){ const r=svg.getBoundingClientRect(); const px=vb.x+(cx-r.left)/r.width*vb.w, py=vb.y+(cy-r.top)/r.height*vb.h; vb.w*=f; vb.h*=f; vb.x=px-(cx-r.left)/r.width*vb.w; vb.y=py-(cy-r.top)/r.height*vb.h; setVB(); }
canvas.addEventListener('wheel',e=>{e.preventDefault(); zoom(e.deltaY>0?1.12:0.89,e.clientX,e.clientY);},{passive:false});
let drag=null, moved=false;
canvas.addEventListener('pointerdown',e=>{ if(e.button!==0)return; drag={x:e.clientX,y:e.clientY,vx:vb.x,vy:vb.y}; moved=false; });
window.addEventListener('pointermove',e=>{ if(!drag)return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y; if(!moved&&Math.hypot(dx,dy)<4)return; moved=true; canvas.classList.add('drag'); const r=svg.getBoundingClientRect(); vb.x=drag.vx-dx*vb.w/r.width; vb.y=drag.vy-dy*vb.h/r.height; setVB(); });
window.addEventListener('pointerup',()=>{drag=null;canvas.classList.remove('drag')});
canvas.addEventListener('click',e=>{ if(moved){moved=false;return;} if(e.target===svg||e.target===canvas) select(null); });
document.getElementById('z-in').onclick=()=>{const r=svg.getBoundingClientRect();zoom(0.8,r.left+r.width/2,r.top+r.height/2)};
document.getElementById('z-out').onclick=()=>{const r=svg.getBoundingClientRect();zoom(1.25,r.left+r.width/2,r.top+r.height/2)};
document.getElementById('z-fit').onclick=fit;
function showTip(e,txt){ tip.textContent=txt; tip.style.display='block'; const r=canvas.getBoundingClientRect(); tip.style.left=Math.min(e.clientX-r.left+14,r.width-290)+'px'; tip.style.top=(e.clientY-r.top+14)+'px'; }
function hideTip(){tip.style.display='none'}

/* ---------- selection & highlight ---------- */
function ancestors(id,acc=new Set()){ const n=N[id]; if(!n)return acc; (n.inputs||[]).forEach(i=>{ if(!acc.has(i)){acc.add(i);ancestors(i,acc);} }); return acc; }
function descendants(id,acc=new Set()){ D.edges.forEach(e=>{ if(e.from===id&&!acc.has(e.to)){acc.add(e.to);descendants(e.to,acc);} }); return acc; }
function applyHighlight(){
  gHi.innerHTML='';
  const nodes=[...gNodes.children], conds=[...gConds.children], wires=[...gWires.children], segs=[...gLife.children];
  nodes.forEach(g=>g.classList.remove('sel','dim')); conds.forEach(g=>g.classList.remove('sel','dim')); wires.forEach(w=>w.classList.remove('up','down','dim')); segs.forEach(g=>g.classList.remove('sel'));
  if(!selected)return;
  if(selected.startsWith('life_')){ segs.forEach(g=>g.classList.toggle('sel',g.dataset.id===selected)); return; }
  let keep=new Set([selected]);
  const partyWire=(c,pid)=>{ if(posN['party_'+pid]) el('path',{class:'wire party',d:path(condPos[c.id],posN['party_'+pid])},gHi); };
  if(C[selected]){ const c=C[selected]; c.quantities.forEach(q=>{keep.add(q); ancestors(q).forEach(a=>keep.add(a));}); (c.parties||[]).forEach(p=>keep.add('party_'+p)); keep.add('gen');
    c.quantities.forEach(q=>{ if(posN[q]) el('path',{class:'wire cond',d:path(posN[q],condPos[c.id])},gHi); });
    (c.parties||[]).forEach(p=>partyWire(c,p));
  } else if(N[selected]&&N[selected].kind==='party'){ const pid=N[selected].pid;
    D.conditions.forEach(c=>{ if((c.parties||[]).includes(pid)){ keep.add(c.id); partyWire(c,pid);} }); keep.add('tradeoffs');
  } else if(selected==='addons'){ keep.add('addons'); keep.add('gen'); D.nodes.filter(n=>n.trial).forEach(n=>keep.add(n.id));
  } else if(N[selected]&&(N[selected].kind==='gen'||N[selected].kind==='pref')){ ['gen','relax','tradeoffs','addons'].concat(OL.preferences.map(p=>p.id)).forEach(i=>keep.add(i)); cols.parties.forEach(n=>keep.add(n.id));
  } else if(selected.startsWith('opp_')){ const o=D.opportunities.find(x=>x.id===selected)||OGROUPS.find(g=>g.o.id===selected).o; o.quantities.forEach(q=>{keep.add(q); ancestors(q).forEach(a=>keep.add(a));});
  } else { ancestors(selected).forEach(a=>keep.add(a)); descendants(selected).forEach(d=>keep.add(d));
    D.conditions.forEach(c=>{ if(c.quantities.includes(selected)){ keep.add(c.id); if(posN[selected]) el('path',{class:'wire cond',d:path(posN[selected],condPos[c.id])},gHi);} });
  }
  nodes.forEach(g=>{const id=g.dataset.id; if(id===selected)g.classList.add('sel'); else if(!keep.has(id))g.classList.add('dim');});
  conds.forEach(g=>{const id=g.dataset.id; if(id===selected)g.classList.add('sel'); else if(!keep.has(id))g.classList.add('dim');});
  const anc=ancestors(selected);
  wires.forEach(w=>{ const f=w.dataset.from,t=w.dataset.to; if(keep.has(f)&&keep.has(t)){ w.classList.add(t===selected||anc.has(t)?'up':'down'); } else w.classList.add('dim'); });
}
function applyFilter(){

  [...gConds.children].forEach(g=>{ const c=C[g.dataset.id]; const hit=q&&(c.name.toLowerCase().includes(q)||c.test.toLowerCase().includes(q)); g.classList.toggle('hit',!!hit); const vis=!hfilter||c.heading===hfilter; g.style.opacity=vis?'':'0.15'; });

function exVal(id){ const v=D.example.values[id]; if(!v)return null; return Array.isArray(v)?v:[v,'',null]; }
function select(id){ selected=id; applyHighlight(); renderInspector(); }

/* ---------- inspector ---------- */
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function ringSVG(conf,r=14){ const c=r+3; return `<svg width="${2*c}" height="${2*c}" aria-hidden="true"><circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--line-2)" stroke-width="4"/>${conf>0?`<path d="${arc(c,c,r,conf/100)}" fill="none" stroke="var(--accent)" stroke-width="4"/>`:''}</svg>`; }
function chips(ids,cls){ return ids.map(i=>{const n=N[i]||C[i]||D.opportunities.find(o=>o.id===i); return n?`<span class="chip ${cls||''}" data-go="${i}">${esc(n.name)}</span>`:`<code>${esc(i)}</code>`;}).join(''); }
function sourceList(ids){ if(!ids||!ids.length)return ''; return '<ul class="srcs">'+ids.map(s=>{const t=D.sources[s]; if(!t)return `<li><code>${esc(s)}</code></li>`; const m=t.match(/https?:\/\/\S+/); const txt=esc(t.replace(/\s*—?\s*https?:\/\/\S+/,'')); return `<li>${txt}${m?` <a href="${m[0]}" target="_blank" rel="noopener">link</a>`:''}</li>`;}).join('')+'</ul>'; }
function roleList(rs){ return '<div class="roles">'+rs.map(x=>{const t=D.sources[x.id]||x.id; const short=esc(t.split(/ — https?:/)[0].split(/[:(,]/)[0].slice(0,48)); return `<div class="role"><span class="rconf" title="confidence ${x.conf}">${x.conf}</span><div><b>${esc(x.term)}</b><br><span>${short} · ${esc(x.role)}${x.verified?'':' · <em>placement unverified</em>'}</span></div></div>`;}).join('')+'</div>'; }
function moveTags(c){ return (c.move||[]).map(m=>`<span class="tag ${m==='physics'?'hard':''}" title="${esc(MC[m]?MC[m].note:'')}">${esc(MC[m]?MC[m].name:m)}</span>`).join(''); }
function exchangeOf(id){ return (D.exchanges||[]).filter(e=>e.dc_to_place.includes(id)||e.place_to_dc.includes(id)).map(e=>{const M=(D.mechanisms||[]).find(x=>x.id===e.mechanism); return `${e.name} — ${e.place_to_dc.includes(id)?'the place gives the data centre':'the data centre gives the place'}${M?' · '+M.name.toLowerCase()+' ('+M.line+' line)':''}`;}); }
function famBlock(id){ const f=G.node_family[id]; if(!f) return ''; const F=G.families[f];
  return `<figure class="mech zoomable" data-fam="${f}" title="Click to enlarge">${F.svg}<figcaption><span>${esc(F.kind)} · <span class="zh">click to enlarge</span></span><a data-guide="${f}">open in the Guide</a></figcaption></figure>
  <p class="why draft">${esc(G.rationale[id]||'')}</p><div class="draftnote">Why it is here — draft wording (Claude), for J.B. to rewrite.</div>`; }
function famKind(id){ const f=G.node_family[id]; if(!f) return ''; const F=G.families[f]; return `<span class="famk"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="${F.icon}" fill="none" stroke="${F.colour}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>${esc(F.name)}</span>`; }
function renderInspector(){
  if(!selected){ insp.innerHTML=`<div class="empty"><div class="kind">How to read this</div>
  <p class="draft">The diagram shows how the tool thinks, left to right. On the far left are two kinds of input: what the data centre brings and what the place offers it. Reciprocity runs both ways. Boxes are the quantities the tool computes. Boxes with a green-grey edge are things the place gives the data centre. The ring shows how far the tool can trust a figure (full = arithmetic, three-quarters = a regulation or government data, half = an operator's claim). A dashed box is a figure the tool does not have yet.</p>
  <p class="draft">Each condition says what it would take to move it: a different option, money, time and process, a change in policy, city-scale infrastructure, or nothing at all (physics). Only that last kind is a hard constraint. There is no verdict. The user sets how many options they want, their limits and what to explore, and those values come in from below. The tool returns that many options in no order, each with a trade-off table that fans out to the parties who gain and give up. What relaxing a limit would open is shown separately. The lifecycle strip underneath shows how the trade-offs shift across the building's life.</p>
  <div class="draftnote">Draft wording (Claude) — for J.B. to rewrite.</div>
  <div class="key"><i style="border-color:var(--k-input)"></i><span>what the data centre brings</span><i style="border-color:var(--k-place)"></i><span>what the place offers</span><i style="border-color:var(--line-2)"></i><span>quantity, with formula and sources</span><i style="border-color:var(--k-condition)"></i><span>condition, with what moves it</span><i style="border-color:var(--accent);border-style:dashed"></i><span>the user's values</span><i style="border-color:var(--k-party)"></i><span>party</span></div>
  <div class="kind" style="margin-top:16px">Outline colour: family group</div><div class="key">${Object.values(G.groups).map(g=>`<i style="border-color:${g.colour}"></i><span>${esc(g.name)}</span>`).join('')}</div>
  <p class="draftnote">Each node's icon names its family; the Guide tab explains every family with a diagram.</p>
  <p style="margin-top:14px">${D.meta.counts.inputs} inputs · ${D.meta.counts.quantities} quantities · ${D.meta.counts.conditions} conditions · ${(D.parties||[]).length} parties · ${D.meta.counts.sources} cited sources (register ${esc(D.meta.date)}).</p>
  ${mode==='example'?`<div class="box2"><div class="kind">Worked example — first attempt</div><b>${esc(D.example.site)}</b><br><span style="color:var(--muted)">${esc(D.example.match)}</span><br><br><span style="font-size:12.5px">${esc((D.example.values.tradeoffs||[''])[0])}</span><div class="draftnote">Condition states are the first attempt's; party rows are not yet computed.</div></div>`:''}
  </div>`; bindGo(); return; }
  let h='';
  if(selected.startsWith('life_')){ const ph=LIFE.find(p=>'life_'+p.id===selected);
    h=`<div class="kind">Lifecycle phase</div><h2>${esc(ph.name)}</h2><div class="confrow">${ringSVG(ph.conf)}<div><b>${ph.conf}</b> confidence</div></div><dl><dt>duration</dt><dd>${esc(ph.years)}</dd>${ph.sources.length?`<dt>sources</dt><dd>${sourceList(ph.sources)}</dd>`:''}</dl>`;
  } else if(C[selected]){ const c=C[selected]; const st=mode==='example'?condState(c):null;
    h=`<div class="kind">Condition · ${esc(c.heading)}</div><h2>${esc(c.name)}</h2><p style="color:var(--muted);margin:6px 0 0">${esc(c.test)}</p>
    <div class="confrow">${ringSVG(weakest(c))}<div><b>${weakest(c)}</b> weakest input<br><small>a condition can be no surer than its weakest figure</small></div></div>
    ${st?`<div class="box2">${esc(D.example.site.split(' (')[0])}, first attempt: <span class="pill ${st}">${vlabel(st)}</span></div>`:''}
    <dl><dt>to move it</dt><dd>${moveTags(c)}${c.constraint?'<br><small style="color:var(--accent-2)">a hard constraint: no price moves it</small>':''}</dd>
    <dt>parties</dt><dd>${chips((c.parties||[]).map(p=>'party_'+p),'p')}</dd>
    <dt>judged on</dt><dd>${chips(c.quantities)}</dd>${c.next_action?`<dt>if it cannot be judged</dt><dd>next: ${esc(c.next_action)}</dd>`:''}${c.note?`<dt>rules</dt><dd>${esc(c.note)}</dd>`:''}${c.sources&&c.sources.length?`<dt>sources</dt><dd>${sourceList(c.sources)}</dd>`:''}</dl><div class="draftnote">What moves each condition, and who it touches, are Claude's proposals for J.B. to check.</div>`;
  } else if(selected.startsWith('opp_')){ const o=D.opportunities.find(x=>x.id===selected)||OGROUPS.find(g=>g.o.id===selected).o;
    h=`<div class="kind">Opportunity</div><h2>${esc(o.name)}</h2><div class="confrow">${ringSVG(oppConf(o))}<div><b>${oppConf(o)}</b> weakest sizing figure</div></div><dl><dt>sized by</dt><dd>${chips(o.quantities)}</dd></dl>`;
  } else { const n=N[selected];
    if(n.kind==='party'){ const pc=D.conditions.filter(c=>(c.parties||[]).includes(n.pid)).map(c=>c.id);
      h=`<div class="kind">Party</div><h2>${esc(n.name)}</h2><p style="color:var(--muted);margin:6px 0 0">${esc(n.formula)}</p><dl><dt>conditions</dt><dd>${chips(pc,'c')}</dd></dl>
      <p class="draftnote">In the tool, each option's trade-off table gives this party one row per concern: what it gains, what it gives up, in that row's own unit, never summed.</p>`;
    } else if(n.id==='gen'){ h=`<div class="kind">Options</div><h2>How options are made</h2><ol class="steps">${OL.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><p class="draftnote">No option is ranked. Preferences shape what is explored, never what wins.</p>`;
    } else if(n.id==='addons'){ const A=D.try_menu||[]; const KL={opportunity:['Opportunities','the data centre gives the place'],place:['From the place','the place gives the data centre'],technology:['Technology choices','the data centre\'s own systems']};
      const li=a=>`<li><span class="st ${a.status}">${esc({sized:'sized',screening:'screening',gate:'temperature gate',excluded:'left out'}[a.status]||a.status)}</span><b>${esc(a.name)}</b>${a.changes&&a.changes.length?`<div class="r">changes: ${esc(a.changes.join(' · '))}</div>`:''}${a.rules&&a.rules.vancouver?`<div class="r">Vancouver: ${esc(a.rules.vancouver)}<br>Edmonton: ${esc(a.rules.edmonton)}</div>`:''}${a.reason?`<div class="r">${esc(a.reason)}</div>`:''}${a.quantities&&a.quantities.length?`<div style="margin-top:6px">${chips(a.quantities)}</div>`:''}</li>`;
      h=`<div class="kind">Options</div><h2>What if we added…</h2><p class="draft" style="margin-top:6px">Any option can try these. Each changes rows of its trade-off table and carries its rule status in each city. They are sorted by which way the exchange runs. Some are possible but blocked by a rule; that shows as a limit a change in policy would move, not hidden. Two are listed only to explain why they are out.</p><div class="draftnote">Draft wording (Claude) — for J.B. to rewrite. From research reports 15a–15d.</div>
      ${['opportunity','place','technology'].map(k=>`<div class="kind" style="margin-top:16px">${KL[k][0]} · <span style="text-transform:none;letter-spacing:0;font-weight:300">${KL[k][1]}</span></div><ol class="addl">${A.filter(a=>a.kind===k).map(li).join('')}</ol>`).join('')}`;
    } else if(n.id==='relax'){ h=`<div class="kind">Options</div><h2>If you moved a limit</h2><p style="color:var(--muted)">A user's limit is always respected. Separately, the tool shows what relaxing each limit would open and at what price. For example: accept a rezoning (about 15 months in Vancouver) and two more options appear, one recovering three times the heat. These options never appear among the results.</p>`;
      const PR=D.limit_presets||[]; if(PR.length){ const byP={}; PR.forEach(x=>(byP[x.place]=byP[x.place]||[]).push(x));
        h+=`<h3 style="margin-top:16px">Rules from elsewhere</h3><p class="draft" style="margin-top:4px">A limit can also be moved by trying another place's rule here. Each shows what it would change and who it favours; none is applied unless the user asks.</p><div class="draftnote">Draft wording (Claude) — for J.B. to rewrite. From research notes 19–21.</div>`;
        Object.keys(byP).forEach(pl=>{ h+=`<div class="kind" style="margin-top:14px">${esc(pl)}</div><ol class="addl">`+byP[pl].map(x=>`<li><b>${esc(x.name)}</b><div class="r">${esc(x.limit)}: ${esc(x.value)}</div><div class="r">favours ${esc(x.favours)} · costs ${esc(x.costs)}</div><div class="r" style="color:var(--muted)">${esc(x.status)}</div></li>`).join('')+'</ol>'; }); }
      const MR=D.model_results||[]; if(MR.length){ h+=`<h3 style="margin-top:16px">Results from elsewhere</h3><p class="draft" style="margin-top:4px">What studies and built cases elsewhere report, labelled by kind of evidence. Shown for comparison; never used as this parcel's numbers.</p><div class="draftnote">Draft wording (Claude). Figures as reported by the learning series; papers not yet read.</div><ol class="addl">`+MR.map(x=>`<li><span class="st">${esc(x.evidence)}</span><b>${esc(x.place)}</b><div class="r">${esc(x.what)}</div><div class="r">${esc(x.figures)}</div><div class="r" style="color:var(--muted)">${esc(x.status)}</div></li>`).join('')+'</ol>'; }
    } else if(n.kind==='pref'){ h=`<div class="kind">The user's values</div><h2>${esc(n.name)}</h2><p style="color:var(--muted)">${esc(n.formula)}</p><p class="draftnote">Values enter from below, separately from the facts on the left.</p>`;
    } else {
      const v=mode==='example'?exVal(n.id):null;
      const uses=D.conditions.filter(c=>c.quantities.includes(n.id)).map(c=>c.id); const feeds=D.edges.filter(e=>e.from===n.id).map(e=>e.to); const opps=D.opportunities.filter(o=>o.quantities.includes(n.id)).map(o=>o.id);
      const ex=exchangeOf(n.id);
      h=`<div class="kind" style="margin-bottom:6px">${famKind(n.id)}</div><div class="kind">${n.kind==='input'?(n.side==='dc'?'Input · the data centre':'Input · the place'):'Quantity · '+esc(n.stage)}${n.direction==='place'&&n.kind==='quantity'?' · the place offers':''}</div><h2>${esc(n.name)}</h2>${n.unit?`<div style="color:var(--muted)">${esc(n.unit)}</div>`:''}
      <div class="confrow">${ringSVG(n.conf)}<div><b>${n.conf}</b> own confidence${n.kind!=='input'&&n.upstream!=null&&n.upstream!==n.conf?` · <b>${n.upstream}</b> upstream`:''}<br><small>${esc(n.status)}</small></div></div>
      ${famBlock(n.id)}
      ${v?`<div class="val"><b>${esc(v[0])}</b><span>${esc(v[1]||'')}${v[2]?' · '+v[2]:''}</span></div>`:(mode==='example'?'<div class="val" style="border-color:var(--line-2)"><span>no value yet for this site</span></div>':'')}
      <dl><dt>formula</dt><dd>${esc(n.formula)}</dd>${n.source_text?`<dt>from</dt><dd>${esc(n.source_text)}</dd>`:''}
      ${ex.length?`<dt>exchange</dt><dd>${ex.map(esc).join('<br>')}</dd>`:''}
      ${n.source_roles&&n.source_roles.length>1?`<dt>by source</dt><dd>${roleList(n.source_roles)}</dd>`:''}
      ${n.inputs&&n.inputs.length?`<dt>inputs</dt><dd>${chips(n.inputs,'i')}</dd>`:''}${feeds.length?`<dt>feeds</dt><dd>${chips(feeds)}</dd>`:''}${uses.length?`<dt>conditions</dt><dd>${chips(uses,'c')}</dd>`:''}${opps.length?`<dt>opportunities</dt><dd>${chips(opps,'o')}</dd>`:''}
      ${n.coef?`<dt>notes</dt><dd><details><summary>coefficients and working, ${n.coef.length} characters</summary><p>${esc(n.coef)}</p></details></dd>`:''}
      ${n.sources&&n.sources.length?`<dt>sources</dt><dd>${sourceList(n.sources)}</dd>`:''}</dl>`;
    }
  }
  insp.innerHTML=h; bindGo();
  insp.querySelectorAll('.mech .ctag').forEach(tg=>tg.classList.toggle('on',tg.dataset.q===selected));
  insp.querySelectorAll('[data-guide]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault(); e.stopPropagation(); window.__openGuide&&window.__openGuide(a.dataset.guide,selected);}));
  insp.querySelectorAll('.mech.zoomable').forEach(m=>m.addEventListener('click',()=>openZoom(m.dataset.fam,selected)));
}
/* enlarged diagram */
function openZoom(f,q){ const F=G.families[f]; let z=document.getElementById('zoom'); if(!z){ z=document.createElement('div'); z.id='zoom'; document.body.appendChild(z);} 
  const NN={}; D.nodes.forEach(n=>NN[n.id]=n);
  z.innerHTML=`<div class="zb" role="dialog" aria-label="${esc(F.name)}"><div class="zt"><svg viewBox="0 0 24 24" width="20" height="20"><path d="${F.icon}" fill="none" stroke="${F.colour}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><b>${esc(F.name)}</b><span class="tag">${esc(F.kind)}</span><button>Close</button></div><div class="zd">${F.svg}<p class="draft" style="font-size:13px">${esc(F.caption)}</p></div><ol>${F.key.map(([n,k])=>`<li data-q="${k}"><span class="gn">${n}</span>${esc((NN[k]||{}).name||k)} <em>${esc((NN[k]||{}).unit||'')}</em></li>`).join('')}</ol></div>`;
  const mark=k=>{ z.querySelectorAll('.ctag').forEach(t=>t.classList.toggle('on',t.dataset.q===k)); z.querySelectorAll('li').forEach(l=>l.classList.toggle('on',l.dataset.q===k)); };
  mark(q); z.hidden=false;
  z.querySelectorAll('li').forEach(l=>l.onclick=()=>mark(l.dataset.q)); z.querySelectorAll('.ctag').forEach(t=>{t.style.cursor='pointer'; t.addEventListener('click',()=>mark(t.dataset.q));});
  const close=()=>{z.hidden=true;}; z.querySelector('.zt button').onclick=close; z.onclick=e=>{ if(e.target===z) close(); };
  document.addEventListener('keydown',function k(e){ if(e.key==='Escape'){close(); document.removeEventListener('keydown',k);} });
  z.querySelector('.zt button').focus();
}
/* resizable side panel */
(function(){ const r=document.getElementById('resizer'), m=document.querySelector('main'); let w=460;
  try{ const s=parseInt(localStorage.getItem('bd_aw')); if(s) w=s; }catch(e){}
  const set=v=>{ w=Math.max(320,Math.min(v,Math.round(window.innerWidth*0.7))); m.style.setProperty('--aw',w+'px'); };
  set(w);
  r.addEventListener('pointerdown',e=>{ r.setPointerCapture(e.pointerId); r.classList.add('drag');
    const mv=ev=>set(m.getBoundingClientRect().right-ev.clientX);
    const up=()=>{ r.classList.remove('drag'); r.removeEventListener('pointermove',mv); r.removeEventListener('pointerup',up); try{localStorage.setItem('bd_aw',w)}catch(e){} };
    r.addEventListener('pointermove',mv); r.addEventListener('pointerup',up); });
  r.addEventListener('keydown',e=>{ if(e.key==='ArrowLeft') set(w+30); if(e.key==='ArrowRight') set(w-30); });
})();
function bindGo(){ insp.querySelectorAll('[data-go]').forEach(c=>c.addEventListener('click',()=>{select(c.dataset.go); centreOn(c.dataset.go);})); }
function centreOn(id){ const p=posN[id]||condPos[id]; if(!p)return; vb.x=p.x+p.w/2-vb.w/2; vb.y=p.y+p.h/2-vb.h/2; setVB(); }

/* ---------- controls ---------- */
function setMode(m){ mode=m; document.getElementById('m-structure').setAttribute('aria-pressed',m==='structure'); document.getElementById('m-example').setAttribute('aria-pressed',m==='example'); drawAll(); renderInspector(); }
document.getElementById('m-structure').onclick=()=>setMode('structure');
document.getElementById('m-example').onclick=()=>setMode('example');
document.getElementById('q').addEventListener('input',e=>{query=e.target.value; applyFilter();});
const hs=document.getElementById('heading'); D.headings.forEach(h=>{const o=document.createElement('option');o.value=h;o.textContent=h;hs.appendChild(o);});
hs.addEventListener('change',e=>{hfilter=e.target.value; applyFilter();});

drawAll(); renderInspector(); oneToOne();
window.__bd={select,centreOn,setMode,fit};
if(location.hash==='#example') setMode('example');
})();
