<!doctype html><html><head><meta charset="utf-8"><title>Exchanges</title>
<style>
@font-face{font-family:Plex;font-weight:400;src:url(plex-400.woff2)}
@font-face{font-family:Plex;font-weight:500;src:url(plex-500.woff2)}
html,body{margin:0;background:#202124;overflow:hidden}
#s{display:block;font-family:Plex,sans-serif}
#band{position:fixed;left:0;right:0;bottom:0;height:270px;background:linear-gradient(rgba(32,33,36,0),rgba(32,33,36,.94) 50%)}
.cap{position:fixed;left:120px;top:905px;font:500 80px/1 Plex,sans-serif;color:#f2efea;letter-spacing:-.01em;opacity:0;white-space:nowrap}
.sub{position:fixed;left:122px;top:845px;font:500 30px/1 Plex,sans-serif;color:#bdb9b2;opacity:0;white-space:nowrap}
</style></head><body>
<svg id="s" width="1920" height="1080"></svg><div id="band"></div>
<script>
// Pitch video, "How the exchanges work" (after the opening). Same neighbourhood as the opening; four examples, each with its proof label and parties.
// Proof labels come from the opportunity register (tool/opps.json readiness): district heat built here (TELUS Garden, BCUC Order C-1-13, 2013);
// reserved capacity and batteries built elsewhere; water reuse built elsewhere (Quincy, WA); EV charging hub, copper bank and refuge room speculative.
const C={bg:'#202124',line:'#34373b',bld:'#3b3e43',fg:'#f2efea',mute:'#bdb9b2',faint:'#918d86',red:'#CC746C',red2:'#e7a39c',heat:'#d1a35e',cold:'#6fa8dc',green:'#7fbf8f'};
const s=document.getElementById('s'), NS='http://www.w3.org/2000/svg';
let P=null; const el=(tag,a,parent=P||s)=>{const e=document.createElementNS(NS,tag); for(const k in a) e.setAttribute(k,a[k]); parent.appendChild(e); return e;};
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), ease=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;};
const seg=(t,a,b)=>ease((t-a)/(b-a)), win=(t,a,b,f=.5)=>Math.min(seg(t,a,a+f),1-seg(t,b-f,b));

// --- the neighbourhood (same seed as the opening)
const gCity=el('g',{});
let seed=7; const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const bx0=860-4*240, by0=340-2*200, B={};
for(let i=-1;i<9;i++) for(let j=-1;j<6;j++){
  const x=bx0+i*240, y=by0+j*200; if(x===860&&y===340) continue; const L=[];
  el('rect',{x,y,width:200,height:160,fill:'none',stroke:C.line,'stroke-width':1},gCity);
  const n=2+Math.floor(rnd()*3); let cx=x+10;
  for(let k=0;k<n&&cx<x+180;k++){ const w=30+rnd()*45, h=40+rnd()*90, yy=y+10+rnd()*(150-h-10);
    L.push(el('rect',{x:cx,y:yy,width:Math.min(w,x+190-cx),height:h,fill:C.bg,'fill-opacity':0,stroke:C.bld,'stroke-width':1.2},gCity)); cx+=w+8; }
  B[x+','+y]=L;
}
el('rect',{x:860,y:340,width:200,height:160,fill:'none',stroke:C.mute,'stroke-width':1.5,'stroke-dasharray':'6 6'});
const dc=el('rect',{x:885,y:365,width:150,height:110,fill:C.red,'fill-opacity':.3,stroke:C.red,'stroke-width':2.5});
const dcL=el('text',{x:960,y:426,'text-anchor':'middle','font-size':22,'font-weight':500,fill:C.fg}); dcL.textContent='Data centre';

// helpers: a flow line (drawn on, then moving dashes), a label, a proof tag, a party chip
const flow=(d,col,dash,w=4)=>{ const g=el('g',{}); const p=el('path',{d,fill:'none',stroke:col,'stroke-width':w,pathLength:1,'stroke-dasharray':'1 1','stroke-linecap':'round'},g);
  const m=el('path',{d,fill:'none',stroke:col,'stroke-width':w+4,pathLength:1,'stroke-dasharray':dash,'stroke-linecap':'round','stroke-opacity':.9},g); return {g,p,m}; };
const text=(x,y,str,fs,col,wt=500,anchor='start')=>{ const t=el('text',{x,y,'font-size':fs,'font-weight':wt,fill:col,'text-anchor':anchor}); t.textContent=str; return t; };
const box=(x,y,str,fs,fg,bg,stroke)=>{ const g=el('g',{}); const w=str.length*fs*.56+fs*1.2, h=fs*1.9;
  el('rect',{x,y:y-h*.68,width:w,height:h,rx:5,fill:bg,stroke:stroke||'none','stroke-width':2},g); const t=el('text',{x:x+fs*.6,y:y+fs*.02,'font-size':fs,'font-weight':500,fill:fg},g); t.textContent=str; return g; };
const proof=(x,y,kind,str,fs=20)=>box(x,y,(kind==='spec'?'Speculative: ':kind==='here'?'Built here: ':'Built elsewhere: ')+str,fs,kind==='spec'?C.red2:'#1d1715',kind==='spec'?C.bg:(kind==='here'?C.green:'#c9c2b6'),kind==='spec'?C.red2:null);
const party=(x,y,str,fs=19)=>box(x,y,str,fs,C.fg,'#2f3236','#4a4e54');
const warm=(key,idx,col)=>(B[key]||[]).filter((_,k)=>idx.includes(k)).map(r=>({r,col}));

// ===== 1. Through a pipe: waste heat to homes (built here)
const S1=[];
const hp=el('g',{}); el('rect',{x:672,y:298,width:56,height:44,rx:4,fill:'#2f3236',stroke:C.heat,'stroke-width':2.5},hp); text(700,326,'HP',18,C.heat,500,'middle'); S1.push(hp);
const pipe=flow('M885,400 H842 V320 H480 V292',C.heat,'0.012 0.04',5);
const pipeBack=flow('M480,292 V312 H842 V420 H885',C.cold,'0.008 0.05',2.5);
const homes1=warm('380,140',[0,1,2,3],C.heat).concat(warm('140,140',[0,1,2],C.heat));
const hpL=text(700,380,'heat pump',20,C.heat,500,'middle'); S1.push(hpL);
const t1=box(360,80,'Waste heat to homes',34,C.fg,'transparent'); S1.push(t1);
const p1=proof(360,124,'here','TELUS Garden, Vancouver (BCUC, 2013)'); S1.push(p1);
const P1=[party(895,555,'Operator gives heat'),party(610,262,'A utility runs the network'),party(150,330,'Homes gain heat')]; S1.push(...P1);

// ===== 2. Through the grid: flexible load and batteries (built elsewhere); EV charging (speculative)
const S2=[];
const sub=el('g',{}); el('rect',{x:1340,y:150,width:120,height:90,rx:4,fill:'#2f3236',stroke:C.mute,'stroke-width':2},sub);
for(let k=0;k<3;k++) el('line',{x1:1360+k*40,y1:165,x2:1360+k*40,y2:225,stroke:C.mute,'stroke-width':2},sub);
S2.push(sub);
const subL=text(1400,280,'substation',28,C.mute,500,'middle'); S2.push(subL);
const batt=el('g',{}); for(let k=0;k<4;k++) el('rect',{x:1000+k*13,y:440,width:10,height:24,rx:2,fill:C.green,'fill-opacity':.25,stroke:C.green,'stroke-width':1.5},batt); S2.push(batt);
const battL=text(1026,494,'batteries',24,C.green,500,'middle'); S2.push(battL);
const grid=flow('M1035,400 H1080 V195 H1340',C.fg,'0.004 0.03',3); grid.p.setAttribute('stroke-dasharray','1 1');
const gridDots=grid.m; gridDots.setAttribute('stroke-dasharray','0.004 0.025');
const ev=flow('M1400,240 V520 H1180 V560',C.fg,'0.004 0.03',3);
const evLot=el('g',{}); for(let k=0;k<6;k++){ el('rect',{x:1118+k*28,y:572,width:18,height:30,rx:3,fill:'#2f3236',stroke:C.red2,'stroke-width':1.8},evLot); el('rect',{x:1114+k*28,y:612,width:26,height:44,rx:5,fill:'none',stroke:C.faint,'stroke-width':1.4},evLot); } S2.push(evLot);
const evL=text(1200,692,'EV charging',28,C.red2,500,'middle'); S2.push(evL);
const t2=box(1150,50,'Power through the grid',46,C.fg,'transparent'); S2.push(t2);
const p2a=proof(1150,108,'else','load cut on request, Indiana (Google)',27); S2.push(p2a);
const p2b=proof(1150,166,'spec','spare capacity for EV charging',27); S2.push(p2b);
const P2=[party(1480,330,'Utility balances the grid',26),party(1250,745,'Drivers charge nearby',26)]; S2.push(...P2);

// ===== 3. Sharing materials: water reuse (built elsewhere), copper bank (speculative)
const S3=[];
const plant=el('g',{}); el('rect',{x:1360,y:560,width:150,height:96,rx:4,fill:'#2f3236',stroke:C.cold,'stroke-width':2.5},plant);
el('circle',{cx:1400,cy:608,r:22,fill:'none',stroke:C.cold,'stroke-width':2},plant); el('circle',{cx:1466,cy:608,r:22,fill:'none',stroke:C.cold,'stroke-width':2},plant); S3.push(plant);
const plantL=text(1435,696,'water treatment',28,C.cold,500,'middle'); S3.push(plantL);
const wOut=flow('M1035,450 H1080 V600 H1360',C.cold,'0.012 0.04',4);
const wBack=flow('M1360,630 H1100 V470 H1035',C.cold,'0.012 0.04',2.5);
const bank=el('g',{}); el('rect',{x:640,y:575,width:160,height:90,rx:4,fill:'#2f3236',stroke:'#c98a5a','stroke-width':2.5},bank);
for(let k=0;k<5;k++) el('rect',{x:656+k*28,y:625-k%2*14,width:22,height:14+k%2*14,fill:'#c98a5a','fill-opacity':.5},bank); S3.push(bank);
const bankL=text(720,706,'material bank',28,'#c98a5a',500,'middle'); S3.push(bankL);
const cu=flow('M910,475 V520 H840 V600 H800',('#c98a5a'),'0.03 0.06',4);
const t3=box(600,50,'Water and materials',46,C.fg,'transparent'); S3.push(t3);
const p3a=proof(600,108,'else','cooling water reused, Quincy, WA',27); S3.push(p3a);
const p3b=proof(600,166,'spec','copper from each server refresh',27); S3.push(p3b);
const P3=[party(1100,770,'The city treats and returns water',26),party(430,770,'Copper stays in the city',26)]; S3.push(...P3);

// ===== 4. Sharing space: a refuge room in a heat wave (speculative)
const S4=[];
const room=el('rect',{x:885,y:440,width:62,height:35,fill:C.red2,'fill-opacity':.0,stroke:C.red2,'stroke-width':3}); S4.push(room);
const door=el('line',{x1:900,y1:475,x2:932,y2:475,stroke:C.bg,'stroke-width':5}); S4.push(door);
const sun=el('g',{}); el('circle',{cx:560,cy:200,r:34,fill:'none',stroke:C.heat,'stroke-width':3},sun);
for(let k=0;k<10;k++){ const a=k/10*Math.PI*2; el('line',{x1:560+Math.cos(a)*46,y1:200+Math.sin(a)*46,x2:560+Math.cos(a)*62,y2:200+Math.sin(a)*62,stroke:C.heat,'stroke-width':3,'stroke-linecap':'round'},sun); } S4.push(sun);
const people=[...Array(14)].map((_,k)=>{ const a=k/14*Math.PI*2+.3, r=330+((k*37)%90); return {c:el('circle',{r:7,fill:C.fg}), x0:916+Math.cos(a)*r, y0:520+Math.sin(a)*r*.6}; });
const t4=box(600,50,'Space in a heat wave',46,C.fg,'transparent'); S4.push(t4);
const p4=proof(600,108,'spec','no data centre found hosting a public refuge',27); S4.push(p4);
const P4=[party(1480,330,'Operator hosts a cooled room',24),party(1480,396,'The city runs it',24),party(1480,462,'Neighbours find relief',24)]; S4.push(...P4);

// captions
const CAP=[[1.0,11.6,'Through a pipe'],[13.0,24.6,'Through the grid'],[26.0,37.6,'Sharing water and materials'],[39.0,49.6,'Sharing space'],[51.2,57.5,'Some built, some not yet tried']].map(([a,b,x])=>{const e=document.createElement('div'); e.className='cap'; e.textContent=x; document.body.appendChild(e); return {a,b,e};});

// timings per scene [start, end]
const SC=[[0,12],[12.6,25],[25.6,38],[38.6,50]];
const AR=1920/1080, frame=(x0,y0,x1,y1)=>{ const h=(y1-y0)/0.72, w=Math.max(x1-x0+100,h*AR); return [(x0+x1)/2-w/2, y0-30, w]; };
const VB=[frame(120,40,1080,580),frame(870,30,1770,770),frame(410,30,1580,800),frame(470,30,1470,790)], FULL=(()=>{const w=2750, h=w/AR; return [140-w*.38, 410-h*.44, w];})();
const vbOf=(t)=>{ let v=FULL;
  for(let i=0;i<4;i++){ const [a,b]=SC[i]; if(t>=a-.6&&t<b){ const prev=i? VB[i-1]:FULL; v=VB[i]; const u=seg(t,a-.6,a+.8); return prev.map((x,k)=>x+(v[k]-x)*u); } }
  if(t>=50) { const u=seg(t,50,51.6); return VB[3].map((x,k)=>x+(FULL[k]-x)*u); } return v; };
const show=(L,o)=>L.forEach(e=>e.setAttribute('opacity',o));
const drawFlow=(f,t,a,dur=1.4,o=1,sp=.1)=>{ f.p.setAttribute('stroke-dashoffset',1-seg(t,a,a+dur)); f.m.setAttribute('opacity',seg(t,a+dur-.2,a+dur+.3)); f.m.setAttribute('stroke-dashoffset',-(t*sp)%1); f.g.setAttribute('opacity',o); };

function R(t){
  const v=vbOf(t); s.setAttribute('viewBox',`${v[0]} ${v[1]} ${v[2]} ${v[2]*1080/1920}`);
  const end=seg(t,50,51.2); // final view: everything stays, quieter
  const sc=i=>{ const [a,b]=SC[i]; return t<a?0: t<b?1: .55+.45*end; };
  // 1
  const o1=sc(0), k1=SC[0][0];
  drawFlow(pipe,t,k1+1.0,1.6,o1?1:0,.12); drawFlow(pipeBack,t,k1+2.6,1.4,o1?.8:0,.08);
  homes1.forEach(({r})=>{ r.setAttribute('fill',C.heat); r.setAttribute('fill-opacity',.55*seg(t,k1+2.4,k1+3.2)*(o1?1:0)); r.setAttribute('stroke',seg(t,k1+2.4,k1+3)>.5&&o1?C.heat:C.bld); });
  show([hp,hpL],seg(t,k1+1.6,k1+2.2)*o1); show([t1],win(t,k1+.6,SC[0][1])+ (t>50?0:0)); show([p1],win(t,k1+3.2,SC[0][1])+end*0);
  P1.forEach((p,i)=>p.setAttribute('opacity',win(t,k1+4.4+i*.9,SC[0][1])));
  // 2
  const o2=sc(1), k2=SC[1][0];
  drawFlow(grid,t,k2+1.0,1.6,o2?1:0,.06); drawFlow(ev,t,k2+4.6,1.4,o2?1:0,.06);
  show([sub,subL],seg(t,k2+.8,k2+1.4)*o2); show([batt,battL],seg(t,k2+2.4,k2+3)*o2);
  batt.querySelectorAll('rect').forEach((r,k)=>r.setAttribute('fill-opacity',.2+.6*(.5+.5*Math.sin(t*2+k))*(t>k2+2.6?1:0)));
  show([evLot,evL],seg(t,k2+5.6,k2+6.2)*o2); show([t2],win(t,k2+.6,SC[1][1])); show([p2a],win(t,k2+3,SC[1][1])); show([p2b],win(t,k2+6.4,SC[1][1]));
  P2.forEach((p,i)=>p.setAttribute('opacity',win(t,k2+7.4+i*.9,SC[1][1])));
  // 3
  const o3=sc(2), k3=SC[2][0];
  drawFlow(wOut,t,k3+1.0,1.4,o3?1:0,.1); drawFlow(wBack,t,k3+2.2,1.4,o3?.85:0,.1);
  show([plant,plantL],seg(t,k3+.8,k3+1.4)*o3); show([bank,bankL],seg(t,k3+5,k3+5.6)*o3); drawFlow(cu,t,k3+4.6,1.2,o3?1:0,.05);
  show([t3],win(t,k3+.6,SC[2][1])); show([p3a],win(t,k3+2.8,SC[2][1])); show([p3b],win(t,k3+6,SC[2][1]));
  P3.forEach((p,i)=>p.setAttribute('opacity',win(t,k3+7.2+i*.9,SC[2][1])));
  // 4
  const o4=sc(3), k4=SC[3][0];
  show([sun],seg(t,k4+.6,k4+1.4)*(t<SC[3][1]?1:1-end)); sun.setAttribute('transform',`rotate(${t*8} 560 200)`);
  room.setAttribute('fill-opacity',.5*seg(t,k4+1.6,k4+2.4)*o4); show([room],seg(t,k4+1.2,k4+1.8)*o4); show([door],seg(t,k4+2.4,k4+2.8)*o4);
  people.forEach(({c,x0,y0},k)=>{ const u=seg(t,k4+3+k*.18,k4+6.2+k*.18), x=x0+(916-x0)*u, y=y0+(482-y0)*u; c.setAttribute('cx',x); c.setAttribute('cy',y); c.setAttribute('opacity',(t<k4+2.6?0:1-seg(t,k4+6+k*.18,k4+6.6+k*.18))*(o4?1:0)); });
  show([t4],win(t,k4+.6,SC[3][1])); show([p4],win(t,k4+3.6,SC[3][1]));
  P4.forEach((p,i)=>p.setAttribute('opacity',win(t,k4+5.2+i*.8,SC[3][1])));
  // final: all four proof tags gather at the top
  CAP.forEach(c=>c.e.style.opacity=win(t,c.a,c.b));
  gCity.setAttribute('opacity',1);
}
// the closing summary: the five proof tags in a row
const SUM=[['here','Built here','Heat to homes'],['else','Built elsewhere','Load cut on request'],['else','Built elsewhere','Water reuse'],['spec','Speculative','EV charging'],['spec','Speculative','Copper bank'],['spec','Speculative','Refuge room']].map(([k,a,b],i)=>{ const d=document.createElement('div');
  d.style.cssText=`position:fixed;left:120px;top:${150+i*92}px;font:500 34px/1 Plex,sans-serif;color:#f2efea;opacity:0;display:flex;align-items:center;gap:18px`;
  d.innerHTML=`<span style="font-size:22px;padding:8px 12px;border-radius:5px;${k==='spec'?'border:2px solid #e7a39c;color:#e7a39c':'background:'+(k==='here'?'#7fbf8f':'#c9c2b6')+';color:#1d1715'}">${a}</span>${b}`; document.body.appendChild(d); return d; });
const R0=R; window.R=t=>{ R0(t); SUM.forEach((d,i)=>d.style.opacity=win(t,51.4+i*.3,57.8)); };
window.R(0);
</script></body></html>
