<!doctype html><html><head><meta charset="utf-8"><title>Future urban data centre</title></head><body>
<script src="three.min.js"></script><script src="sheet3d.js"></script>
<script>
// Pitch draft 4: a question, not a design. One data centre with the exchanges drawn on the sheets, each with its proof tag as on the sheets:
// EV charging (speculative; BC: chargers not regulated as a utility), cooling water reused (Quincy, WA), sewage heat (Vancouver NEU, 3.2 MW, a comparator),
// heat to a school (Heerlen, claim). Rooftop solar: a share of the load (energy sheet). Schematic, not to scale.
setup({n:'',title:'',sub:'',key:[],caps:[],conds:[],keys:[[0,V(11,-1,7),21,240],[10.6,V(11,-1,7),18.5,240]],dur:10.6,condAt:99,keyIn:99});
document.getElementById('hd').style.display='none';
const dc=box(12,6.5,8,0,0,0,{}); const fl=[2.2,4.4].map(y=>lineSeg([V(-6,y,4.01),V(6,y,4.01),V(6.01,y,4),V(6.01,y,-4)],0x6a6d73,.7));
const pv=[]; for(let r=0;r<4;r++) for(let c=0;c<3;c++){ const g=box(3.2,.08,1.3,-3.8+c*3.8,6.75,-2.8+r*1.9,{edge:0x8fa3c9,fill:0x2f3a4a}); g.rotation.x=-.3; pv.push(g); }
const ev=R_.evlot(0,10.5);
const plant=R_.tanks(24,-3,3,1.5), school=R_.school(22,15);
const W1=pipe([V(6,.5,-1),V(14,.5,-1),V(14,.5,-3),V(19.5,.5,-3)],0x8fc3dc,.16,3.4,1.2,10,.05);
const W2=pipe([V(19.5,1.1,-4.4),V(13.4,1.1,-4.4),V(13.4,1.1,-2.4),V(6,1.1,-2.4)],0xd99a4e,.16,3.8,1.2,10,.05);
const H1=pipe([V(6,.6,2),V(16,.6,2),V(16,.6,12.4),V(18.4,.6,12.4)],0xe07b39,.18,5.4,1.4,12,.05);
const C1=pipe([V(4,.4,4),V(4,.4,6.6),V(3.6,.4,8)],0x6fa3d8,.12,2.4,.7,5,.06);
lab('<b>Rooftop solar</b><i>a share of the load</i>',V(0,7.3,-1),1.6,10.4,30,-70);
lab(`<b>EV charging</b><br>${tagHTML('spec','BC: chargers not regulated as a utility')}`,V(-3,1.5,12),2.8,10.4,-60,90);
lab(`<b>Cooling water, treated and reused</b><br>${tagHTML('else','Quincy, WA')}`,V(24,1,-3),4.4,10.4,40,-80);
lab(`<b>Sewage heat</b><br>${tagHTML('here','Vancouver NEU, 3.2 MW')}`,V(16,1.1,-4.4),5.0,10.4,30,-110);
lab(`<b>Heat for a school</b><br>${tagHTML('else','Heerlen (claim)')}`,V(22,4.6,12.4),6.4,10.4,40,-40);
document.body.insertAdjacentHTML('beforeend','<div id="fq" style="position:fixed;left:120px;top:810px;font:500 70px/1.12 Plex;letter-spacing:-.01em;opacity:0">What will the urban data centre<br>of the future offer, beyond data?</div>');
const fq=document.getElementById('fq');
UPD=t=>{
  setOp(dc,seg(t,.1,.8)); fl.forEach(l=>l.material.opacity=.7*seg(t,.4,1));
  pv.forEach((g,i)=>setOp(g,seg(t,1.2+i*.06,1.6+i*.06))); setOp(ev,seg(t,2.2,2.9));
  setOp(plant,seg(t,3.0,3.6)); setOp(school,seg(t,5.0,5.6));
  fq.style.opacity=win(t,.6,10.4,.6); document.body.style.opacity=1-seg(t,10.2,10.6);
};
R(0);
</script></body></html>
