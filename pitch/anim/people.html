<!doctype html><html><head><meta charset="utf-8"><title>People and place</title></head><body>
<script src="three.min.js"></script><script src="sheet3d.js"></script>
<script>
// Sheet 5, People and place (Exchange sheets draft v3). Figures as on the sheet: night 10 p.m.–7 a.m.; night limit at a resident in a quiet zone, by the source's zone:
// quiet 45, intermediate 50, activity 55 dBA; refuge 3.5 m² per person, clean air MERV 13+, 2–3 air changes an hour; receivers: workers (N. Virginia; jobs under
// 0.5 % of the local workforce), neighbours (not yet known), the city: ground floor (speculative, none found), passers-by (speculative, 111 E 5th, proposed).
setup({col:'#b79fd6',n:'5',title:'People and place',sub:'What the building gives its street, and what it asks of it',
 key:[['#f2efea','people, sidewalk'],['#f2efea','possible route in',1],['#d99a4e','heat feed, sheet 1'],['#a9b4e0','power feed, sheet 2'],['#b79fd6','night sound contour',1]],
 caps:[[.4,2.8,'What it asks of the street'],[3.0,6.0,'What it could give back']],
 conds:[['Technical','Source sound level','not in our sources'],['Technical','Refuge 3.5 m² per person','clean air MERV 13+, 2–3 air changes an hour'],['Temporal','Night 10 p.m.–7 a.m.','when the lower limits apply'],['Economic','Running the room','power, heat and clean air; not in our sources'],['Regulatory','Public use and security','how much of the ground floor security allows'],['Environmental','Shadow','fall-equinox shadows on parks, schools, sidewalks']],
 keys:[[0,V(4,2.5,3),15,200],[5.0,V(5,2,3),13,330],[11.2,V(5,1,4),15,250],[13.8,V(5,1,4),17,340],[20,V(5,1,4),17.5,340]],dur:13.6,condAt:99,keyIn:2.4});
const bld=box(9,7,8,0,0,0,{fo:.4}); bld.children[0].material.depthWrite=false; const fl=[2.4,4.7].map(y=>{ const l=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(9.02,.01,8.02)),new THREE.LineBasicMaterial({color:0x6a6d73,transparent:true})); l.position.set(0,y,0); scene.add(l); return l; });
const units=[0,1].map(i=>box(2,1.2,2.2,-2+i*2.6,7,-1.5,{edge:0xd99a4e}));
const road=box(4.6,.05,46,9.8,0,6,{fill:0x2c2e33,edge:0x3b3e43}); const walks=[7,12.6].map(x=>box(.9,.08,46,x,0,6,{fill:0x34363b,edge:0x4a4e54}));
const nb=[R_.houses(18.5,-4,2),R_.housing(17.5,10,5,6,6,0x9a968f),R_.houses(-2,12,2)];
const room=box(3.2,2.3,3,2.6,0,2.4,{dashed:true,edge:0xe7a39c,fo:0}); const roomFill=box(3.1,2.2,2.9,2.6,0,2.4,{fill:0xe7a39c,fo:.5,edge:0xe7a39c,eo:0});
const hf=pipe([V(-3,1.6,2.4),V(1,1.6,2.4)],0xd99a4e,.08,6.4,.8,4,.08); const pf=pipe([V(-3,1.1,3.2),V(1,1.1,3.2)],0xa9b4e0,.08,6.6,.8,4,.08);
const route=new THREE.Line(new THREE.BufferGeometry().setFromPoints([V(7,.15,2.4),V(4.6,.15,2.4)]),new THREE.LineDashedMaterial({color:0xf2efea,dashSize:.3,gapSize:.2,transparent:true,opacity:0})); route.computeLineDistances(); scene.add(route);
// night sound contours on the ground, from the roof units
const rings=[[9,'55'],[14,'50'],[20,'45 dBA']].map(([r,l],i)=>{ const pts=[...Array(97)].map((_,k)=>{const a=k/96*Math.PI*2; return V(-.7+Math.cos(a)*r,.06,-1.5+Math.sin(a)*r);});
  const ln=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineDashedMaterial({color:0xb79fd6,dashSize:.5,gapSize:.35,transparent:true,opacity:0})); ln.computeLineDistances(); scene.add(ln); return {ln,r,l,i}; });
const waves=[...Array(3)].map(()=>{ const ln=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.CircleGeometry(1,40)),new THREE.LineBasicMaterial({color:0xb79fd6,transparent:true})); ln.rotation.x=-Math.PI/2; scene.add(ln); return ln; });
// people walking on the sidewalks; some turn in at the door
const ppl=[...Array(16)].map((_,i)=>{ const m=new THREE.Mesh(new THREE.CylinderGeometry(.13,.13,.7,8),new THREE.MeshBasicMaterial({color:0xdcd7cf,transparent:true})); scene.add(m);
  return {m,side:i%2?12.6:7,ph:(i*.173)%1,dir:i%3?1:-1,enter:i%4===0&&i%2===0}; });
lab('<b>Roof cooling units</b><i>source sound level?</i>',V(-.7,8.4,-1.5),1.4,5.6,26,-40);
const rl=rings.map(r=>lab(`<b>${r.l}</b>`,V(-.7+r.r*.7,.1,-1.5+r.r*.7),2.6+r.i*.5,11.8,6,-10));
lab('<b>Night sound contours</b><i>10 p.m.–7 a.m., when the lower limits apply</i>',V(-.7,.1,18.5),3.6,11.8,-480,-40);
lab('<b>Refuge room (possible)</b><i>3.5 m² per person; clean air MERV 13+</i>',V(2.6,2.6,2.4),6.2,11.8,26,-70);
lab('<b>Door and route in (possible)</b><i>who opens and runs it? who pays?</i>',V(5.2,.3,2.4),7.4,11.8,26,20);
panel(`<div class="ph">Night limit, dBA</div><div style="font:400 16px Plex;color:#bdb9b2;margin-bottom:10px">at a resident in a quiet zone, by the source's zone</div>
 <div style="display:grid;grid-template-columns:120px 1fr;gap:10px 14px;align-items:center;font:400 19px Plex;color:#bdb9b2">
 ${[['quiet',45],['intermediate',50],['activity',55]].map(([z,v])=>`<span>${z}</span><span><span style="display:inline-block;width:${(v-35)*8}px;height:12px;background:#b79fd6;opacity:.8"></span> <b style="color:#f2efea;font-weight:500">${v}</b></span>`).join('')}</div>`,3.8,9.6,'left:120px;top:250px');
UPD=t=>{
  setOp(bld,seg(t,.1,.8)); fl.forEach(l=>l.material.opacity=.6*seg(t,.5,1)); units.forEach((g,i)=>setOp(g,seg(t,.8+i*.2,1.3+i*.2)));
  setOp(road,seg(t,.4,1)); walks.forEach(g=>setOp(g,seg(t,.5,1.1))); nb.forEach((g,i)=>setOp(g,seg(t,1+i*.2,1.6+i*.2)));
  waves.forEach((w,i)=>{ const q=((t*.4)+i/3)%1; w.scale.set(2+q*20,2+q*20,1); w.position.set(-.7,.08,-1.5); w.material.opacity=(1-q)*.5*win(t,1.6,5.8); });
  rings.forEach(r=>r.ln.material.opacity=.85*seg(t,2.6+r.i*.5,3.2+r.i*.5)*(1-.6*seg(t,11.8,12.4)));
  setOp(room,seg(t,6,6.6)); setOp(roomFill,seg(t,6.4,7)*.6); route.material.opacity=seg(t,7.2,7.8);
  ppl.forEach(p=>{ const q=((t*.05*p.dir)+p.ph+10)%1; let x=p.side, z=-14+q*40, o=seg(t,.8,1.4);
    if(p.enter){ const e=seg(t,8.2+p.ph*1.5,9.6+p.ph*1.5); const z0=-14+((8.2+p.ph*1.5)*.05*p.dir+p.ph+10)%1*40; if(e>0){ z=z0+(2.4-z0)*Math.min(1,e*1.6); x=e>.62?7-(7-3.6)*((e-.62)/.38):7; o*=1-seg(t,9.6+p.ph*1.5,10+p.ph*1.5)*.0; } }
    p.m.position.set(x,.4,z); p.m.material.opacity=o; });
};
const crew=R_.people(5.6,-3.2,6), front=grp(box(.15,.12,3.4,4.85,2.5,2.4,{edge:0xe7a39c,fill:0x3a2a2a}),lineSeg([V(4.52,.2,1),V(4.52,2.3,1),V(4.52,2.3,1),V(4.52,2.3,3.8),V(4.52,2.3,3.8),V(4.52,.2,3.8),V(4.52,.2,2.4),V(4.52,2.3,2.4)],0xe7a39c,.9),box(1.6,.45,.5,5.8,0,4.6,{edge:0x9a968f})),
  street=R_.trees([[14,9],[14,13.5],[14,18]]), bench=box(.6,.45,1.8,13.6,0,15.8,{edge:0x9a968f});
visits({tint:[nb[0],nb[2]],start:6.0,slot:1.75,k:1.95,list:[
 {n:1,name:'Workers',gets:'jobs on site',k:'else',where:'N. Virginia: jobs under 0.5 % of the workforce',obj:crew,at:V(5.6,1.2,-3.2),tg:V(5.6,1.5,-2),hh:6,cap:'Jobs for workers'},
 {n:2,name:'Neighbours',gets:'a refuge in an outage?',k:'nyk',where:'inside the sound contours?',at:V(18.5,5,-4),tg:V(17.5,2.5,-3),hh:7,cap:'A refuge for neighbours'},
 {n:3,name:'The city: ground floor',gets:'a room open to the street',k:'spec',where:'none found',obj:front,at:V(4.6,1.6,2.4),tg:V(4.5,1.5,2.4),hh:5.5,cap:'A ground floor for the city'},
 {n:4,name:'Passers-by',gets:'a better street frontage',k:'spec',where:'111 E 5th, proposed',obj:grp(street,bench),at:V(14,2.6,13.5),tg:V(13,1.5,13.5),hh:6.5,cap:'A frontage for passers-by'}],
 outro:[V(5,1,4),17,340]}); visitCaps();
R(0);
</script></body></html>
