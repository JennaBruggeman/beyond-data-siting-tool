# The public web version on GitHub Pages (J.B. 13 Nov 2026). The site is built on J.B.'s computer (publish/build_public.py: open data only, with its
# leak check) and attached to a GitHub release as public.zip; this workflow downloads that zip and publishes it as the Pages artifact. The data files
# are never committed to git. It runs when publish/pages_release.txt changes on site-f1 (that file names the release holding public.zip; a run by
# hand works once the workflow is on the default branch).
name: Publish the public web version
on:
  push:
    branches: [site-f1]
    paths: [publish/pages_release.txt]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag holding public.zip (blank = publish/pages_release.txt)
        required: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: publish/pages_release.txt
          sparse-checkout-cone-mode: false
      - name: Download the built site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag }}"; [ -n "$TAG" ] || TAG="$(tr -d '[:space:]' < publish/pages_release.txt)"
          echo "release: $TAG"
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern public.zip
          mkdir site && unzip -q public.zip -d site
          test -f site/index.html && test -f site/MANIFEST.md
          grep -q "window.BD_PUBLIC=true" site/index.html
          if find site -path '*/tiles/edm/l_*' | grep -q .; then echo "Edmonton lot outline tiles found: not publishing"; exit 1; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
