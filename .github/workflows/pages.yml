# The public web version on GitHub Pages (J.B. 13 Nov 2026). The site is built on J.B.'s computer (publish/build_public.py: open data only, with its
# leak check) and attached to a GitHub release as public.zip; this workflow downloads that zip and publishes it as the Pages artifact. The data files
# are never committed to git. Run by hand: Actions → Publish the public web version → Run workflow (tag of the release holding public.zip).
name: Publish the public web version
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag holding public.zip
        required: true
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the built site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.tag }}" --repo "${{ github.repository }}" --pattern public.zip
          mkdir site && unzip -q public.zip -d site
          test -f site/index.html && test -f site/MANIFEST.md
          grep -q "window.BD_PUBLIC=true" site/index.html
          if find site -path '*/tiles/edm/l_*' | grep -q .; then echo "Edmonton lot outline tiles found: not publishing"; exit 1; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
