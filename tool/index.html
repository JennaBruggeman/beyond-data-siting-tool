<meta charset="utf-8">
<title>Beyond Data</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600&display=swap">
<style>
/* Beyond Data — the tool, round 1: city → parcel → site card → what is being built. Dark-only by decision (J.B., 9 Oct). */
:root{
  color-scheme:dark;
  --bg:#17181a; --panel:#1e2023; --panel-2:#24272b; --line:#30343a; --line-2:#3c4148;
  --fg:#e9e6e1; --muted:#9d9a94; --faint:#6b6964;
  --accent:#CC746C; --accent-2:#e39a93; --place:#86ada7; --water:#7fb2c4;
  --font:"Open Sans",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:300 14px/1.5 var(--font);overflow:hidden}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
.app{display:grid;grid-template-rows:auto 1fr;height:100%}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);position:relative;z-index:3}
header h1{font-size:15px;font-weight:600;letter-spacing:.02em;margin:0;white-space:nowrap}
header h1 span{font-weight:300;color:var(--muted);margin-left:8px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;overflow:hidden}
.seg button{background:transparent;border:0;padding:5px 12px;cursor:pointer;color:var(--muted);font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:#1a1212;font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent-2);outline-offset:1px}
.search{position:relative;flex:1 1 220px;max-width:360px}
.search input{width:100%;background:var(--bg);border:1px solid var(--line-2);border-radius:6px;padding:6px 10px}
.results{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--line-2);border-radius:6px;list-style:none;margin:0;padding:4px;max-height:280px;overflow:auto}
.results li{padding:6px 8px;border-radius:4px;cursor:pointer;font-size:13px}
.results li:hover,.results li[aria-selected="true"]{background:var(--panel-2)}
.results li.none{color:var(--muted);cursor:default}
header select{background:var(--bg);border:1px solid var(--line-2);border-radius:6px;padding:6px 8px;max-width:100%}
.tb{display:inline-flex;gap:4px;margin-left:auto}
.tb button{background:var(--panel-2);border:1px solid var(--line-2);border-radius:6px;width:30px;height:30px;cursor:pointer}
.tb button:hover{border-color:var(--accent)}
main{display:grid;grid-template-columns:minmax(320px,440px) 1fr;min-height:0} main>aside{order:-1}
#map{position:relative;overflow:hidden;cursor:grab;min-width:0;touch-action:none}
#map.drag{cursor:grabbing}
#map canvas{display:block;width:100%;height:100%}
.legend{position:absolute;left:12px;bottom:12px;background:rgba(30,32,35,.92);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:12px;max-width:calc(100% - 24px)}
.legend div{display:flex;align-items:center;gap:8px;margin:2px 0}
.legend i{display:inline-block;width:18px;height:10px;border-radius:2px;flex:none}
.legend summary{cursor:pointer;font-weight:400;margin-bottom:4px}
.legend .src{color:var(--faint);font-size:11px;margin-top:6px;max-width:300px}
.status{position:absolute;right:12px;top:12px;background:rgba(30,32,35,.92);border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-size:12px;color:var(--muted)}
.scale{position:absolute;right:12px;bottom:12px;font-size:11px;color:var(--muted);text-align:right}
.scale b{display:block;height:4px;border:1px solid var(--muted);border-top:0;margin-top:2px}
aside{border-right:1px solid var(--line);background:var(--panel);overflow:auto;padding:18px 18px 40px;min-width:0}
.kind{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
aside .x{float:right;background:transparent;border:1px solid var(--line-2);border-radius:6px;padding:2px 9px;cursor:pointer;color:var(--muted);font-size:12.5px}
aside .x:hover{border-color:var(--accent);color:var(--fg)}
aside h2{font-size:19px;font-weight:400;margin:4px 0 2px;line-height:1.3;text-wrap:balance}
aside h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:22px 0 8px;padding-top:14px;border-top:1px solid var(--line)}
.sub{color:var(--muted);font-size:13px}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:8px 0 0;font-size:13px}
dt{color:var(--muted)} dd{margin:0;font-variant-numeric:tabular-nums;min-width:0}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:400;border:1px solid var(--line-2)}
.pill.yes{border-color:var(--place);color:var(--place)} .pill.case{border-color:#cdb07a;color:#cdb07a} .pill.site{border-color:var(--muted);color:var(--muted)} .pill.no{border-color:var(--faint);color:var(--muted)}
.draft{color:var(--fg)} button.mo{background:none;border:0;padding:0 2px;color:var(--muted);font:inherit;font-size:11.5px;text-decoration:underline dotted;cursor:pointer} button.mo:hover{color:var(--fg)} .k{color:var(--accent-2)}
dl.lim{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:8px 0;font-size:12.5px;line-height:1.45} dl.lim dt{color:var(--fg)} dl.lim dd{margin:0;color:var(--muted)}
.draftnote{font-size:11px;color:var(--faint);margin-top:6px}
.src{font-size:12px;color:var(--faint)} .src a{color:var(--muted)}
.gap{color:var(--faint);font-style:italic}
.q{margin:14px 0 0}
.q .lab{font-size:13px;margin-bottom:6px}
.mwtrack{position:relative;margin:40px 0 2px;height:22px}
.mwtrack input{position:relative;width:100%;margin:0;z-index:2;accent-color:var(--accent)}
.mwtrack .band{position:absolute;top:21px;height:4px;background:var(--fg);opacity:.45;border-radius:2px}
.mwtrack .tick{position:absolute;top:-4px;height:26px;border-left:1px solid var(--muted)}
.mwtrack .tick span{position:absolute;bottom:26px;left:-1px;font-size:11px;color:var(--muted);white-space:nowrap;transform:translateX(-50%)}
.mwtrack .tick.alt span{bottom:38px} .mwtrack .tick.alt{top:-16px;height:38px} .mwtrack .tick:last-of-type span{transform:translateX(-100%)}
.math{margin:8px 0 4px;font-size:12.5px;color:var(--muted)} .math summary{cursor:pointer;color:var(--accent);font-size:12px} .math ol{margin:6px 0 4px 18px;padding:0;display:grid;gap:5px} .math b{color:var(--fg);font-weight:400}
.mwscale{position:relative;height:16px;font-size:11px;color:var(--faint)}
.mwscale span{position:absolute;transform:translateX(-50%)} .mwscale span:first-child{transform:none} .mwscale span:last-child{transform:translateX(-100%)}
.q .seg{flex-wrap:wrap;border-radius:8px}
.q .seg button{font-size:13px;padding:6px 12px}
.q small{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{background:transparent;border:1px solid var(--line-2);border-radius:999px;padding:4px 10px;font-size:12.5px;cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{border-color:var(--accent);color:var(--fg)}
.next{margin-top:20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.next button{background:var(--accent);color:#1a1212;border:0;border-radius:6px;padding:8px 14px;font-weight:600;cursor:pointer}
.next button[disabled]{background:var(--panel-2);color:var(--faint);cursor:not-allowed}
.intro p{margin:8px 0}
.intro ol{padding-left:18px;margin:8px 0}
a{color:var(--accent-2)}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0}
.opt{border:1px solid var(--line-2);border-radius:6px;padding:8px;font-size:12.5px;min-width:0}
.opt b{font-weight:400}
.tt{overflow-x:auto;margin-top:8px}
.tt table{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums}
.tt th{font-weight:600;color:var(--muted);text-align:left;padding:4px 6px;border-bottom:1px solid var(--line-2)}
.tt td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top;min-width:90px}
.tt td:first-child{color:var(--muted);min-width:110px}
.tt tr.party td{color:var(--fg);font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;padding-top:12px;border-bottom:1px solid var(--line-2)}
.st{display:inline-block;width:8px;height:8px;transform:rotate(45deg);margin-right:6px;vertical-align:1px;border:1px solid var(--muted)}
.st-met{background:#8fb996;border-color:#8fb996}.st-chg{background:#CC746C;border-color:#CC746C}.st-not{background:#b24f49;border-color:#b24f49}.st-cj{background:transparent}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0 4px;border-bottom:1px solid var(--line)}
/* the path: five steps (16 Oct) */
.path{display:flex;justify-content:space-between;gap:6px;margin:0 0 6px;border-bottom:1px solid var(--line-2)}
.path button{flex:0 1 auto;min-width:0;background:transparent;border:0;border-bottom:2px solid transparent;padding:8px 2px 9px;color:var(--muted);font-size:12.5px;cursor:pointer;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.path button span{display:inline-block;margin-right:4px;color:var(--faint);font-variant-numeric:tabular-nums}
.path button:hover{color:var(--fg)}
.path button[aria-current="step"]{color:var(--fg);border-bottom-color:var(--accent)}
.path button[aria-current="step"] span{color:var(--accent-2)}
.path button:focus-visible,.sec>summary:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
.ctx{margin:4px 0 12px;font-size:12px;color:var(--muted)}.ctx a{color:var(--muted)}
/* closed sections that show their answer (16 Oct) */
.sec{border-top:1px solid var(--line)}.sec:last-of-type{border-bottom:1px solid var(--line)}
.sec>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:1fr auto;column-gap:10px;padding:11px 2px 11px 0}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary::after{content:'';grid-column:2;grid-row:1;align-self:center;width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(-45deg);transition:transform .15s}
.sec[open]>summary::after{transform:rotate(45deg)}
.sec>summary .t{grid-column:1;font-size:14.5px;color:var(--fg)}
.sec>summary .a{grid-column:1;font-size:12.5px;line-height:1.45;color:var(--muted);margin-top:3px}
.sec>summary .a.f{color:var(--accent-2)}
.sec>summary:hover .t{text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
.sec>.b{padding:0 0 14px}
.sec>.b>h3:first-child{margin-top:0}
.fp{margin:8px 0 0}.fp>summary{list-style:none;cursor:pointer;display:inline-block;font-size:11.5px;color:var(--muted);border:1px solid var(--line-2);border-radius:999px;padding:1px 9px}
.fp>summary::-webkit-details-marker{display:none}.fp[open]>summary{color:var(--fg)}.fp>div{margin-top:6px;font-size:11.5px;color:var(--muted)}.fp>div .src,.fp>div p{color:var(--muted)}
.lead{font-size:14px;line-height:1.5;color:var(--fg);margin:4px 0 12px}
@media (prefers-reduced-motion:reduce){.sec>summary::after{transition:none}}
.tabs button{background:transparent;border:0;border-bottom:2px solid transparent;padding:6px 8px;font-size:12.5px;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.legend2{font-size:12px;color:var(--muted);margin-top:10px}
.legend2 span{display:inline-flex;align-items:center;gap:6px;margin-right:14px} .legend2 i{display:inline-block;width:10px;height:10px}
#side .chart svg{display:block;width:100%;min-width:420px;height:auto;font-family:inherit}
.tt td.r,.tt th.r{text-align:right;min-width:60px}
body.wide main{grid-template-columns:minmax(320px,680px) 1fr}
@media (max-width:760px){
  main{grid-template-columns:1fr;grid-template-rows:minmax(260px,1fr) auto}
  aside{border-right:0;border-top:1px solid var(--line);max-height:52vh} main>aside{order:0}
  .tb{display:none}
  header{gap:8px 10px;padding:8px 12px}
  header h1 span{display:none}
  header select{flex:1 1 100%}
  .search{flex:1 1 100%;max-width:none;order:3}
  .legend{left:8px;bottom:8px;padding:6px 8px}
}

/* extras (v17) */
.evb{display:inline-block;font-size:10px;letter-spacing:.02em;border:1px solid var(--line-2);border-radius:8px;padding:0 6px;margin-right:4px;color:var(--muted);white-space:nowrap}
.ev-record,.ev-filed{border-color:#7f9a7a;color:#9fb38a}.ev-filed{border-style:dotted}.ev-peer{border-color:#7a8fa8;color:#a7b4d6}.ev-survey,.ev-claim{border-color:#9a6f6a;color:var(--accent)}.ev-physics{border-color:#6f7680;color:var(--fg)}.ev-transfer,.ev-assume{border-style:dashed}
.rbar{margin:6px 0 4px;font-size:11.5px}.rrow{display:grid;grid-template-columns:86px 1fr 92px;gap:8px;align-items:center;margin:3px 0}
.rlab{color:var(--muted)}.rval{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}.rtrack{position:relative;height:8px;background:var(--line);border-radius:4px}
.rfill{position:absolute;top:0;height:8px;background:var(--accent);border-radius:4px}.rfill.ghost{background:transparent;border:1px dashed var(--muted);height:6px}
.rscale{position:relative;height:12px;color:var(--faint);font-size:10px}.rscale i{position:absolute;font-style:normal;transform:translateX(-50%)}.rscale i:first-child{transform:none}.rscale i:last-child{transform:translateX(-100%)}
.examples{margin-top:18px;border-top:1px solid var(--line);padding-top:6px}.ex{display:block;width:100%;text-align:left;background:var(--panel-2);border:1px solid var(--line-2);border-radius:6px;padding:8px 10px;margin:6px 0;color:var(--fg);cursor:pointer;font:inherit}
.ex b{font-weight:400;display:block}.ex span{color:var(--muted);font-size:12px}.ex:hover{border-color:var(--accent)}
.lim{padding-left:18px;margin:6px 0}.lim li{margin:6px 0;font-size:13px}
.gl{border-bottom:1px dotted var(--muted);cursor:help}
.torn{margin:8px 0}.trow{display:grid;grid-template-columns:150px 1fr 92px;gap:8px;align-items:center;margin:8px 0;font-size:12.5px}.ttrack{position:relative;height:12px;background:var(--line);border-radius:3px}
.tfill{position:absolute;top:0;height:12px;background:var(--accent);opacity:.8;border-radius:3px}.tbase{position:absolute;top:-3px;width:2px;height:18px;background:var(--fg)}.tval{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.fbin{display:block;width:100%;margin:4px 0 10px;background:var(--bg);border:1px solid var(--line-2);border-radius:6px;padding:7px 9px;color:var(--fg);font:inherit}
.scrbtn{position:absolute;right:12px;bottom:40px;z-index:5;background:var(--panel);border:1px solid var(--line-2);color:var(--muted);border-radius:6px;padding:5px 10px;font:inherit;font-size:12px;cursor:pointer}.scrbtn[aria-pressed=true]{border-color:var(--accent);color:var(--fg)}
.scrleg{position:absolute;right:12px;bottom:76px;z-index:5;width:250px;background:var(--panel);border:1px solid var(--line-2);border-radius:8px;padding:10px 12px;font-size:12px}.scrleg i{display:inline-block;width:14px;height:10px;margin-right:6px;vertical-align:-1px}
.fbbtn{background:var(--accent);color:#1a1212;border:0;border-radius:6px;padding:7px 14px;cursor:pointer;font:inherit}
@media (max-width:600px){.trow{grid-template-columns:110px 1fr 80px}.rrow{grid-template-columns:70px 1fr 84px}}
.idx.gr th{font-weight:400;color:#9d9a94;font-size:11px;text-align:left}.idx.gr th.r{text-align:right}.rowlink{cursor:pointer}.rowlink:hover td{background:#26292e}.chev{color:#CC746C;width:14px}h3.gh{margin-top:16px}h3.gh .src{display:inline;margin-left:6px;text-transform:none;letter-spacing:0}

/* the guided path (flow.js) */
#welcome{position:fixed;inset:0;z-index:50;background:#0b0c0d;display:flex;align-items:center;justify-content:center;padding:16px;overflow:hidden}
#welcome .wbg{position:absolute;inset:0;width:100%;height:100%}
#welcome .wbg{opacity:0;transition:opacity .9s ease-out} #welcome .wbg.on{opacity:1}
@media (prefers-reduced-motion:reduce){#welcome .wbg{transition:none}}
#welcome .wcard{position:relative}
#welcome .wcard{width:min(520px,100%);max-height:calc(100% - 32px);overflow:auto;background:var(--panel);border:1px solid var(--line-2);border-radius:10px;padding:22px 24px 18px;box-shadow:0 18px 50px rgba(0,0,0,.45)}
#welcome h2{font-size:21px;font-weight:300;margin:6px 0 10px;line-height:1.3;text-wrap:balance} #welcome p{margin:0 0 12px;line-height:1.5}
.wsteps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 12px;margin:4px 0 18px;padding:0;list-style:none;color:var(--muted);font-size:12.5px} .wsteps span{color:var(--faint);margin-right:6px;font-variant-numeric:tabular-nums}
.flowbar .path{justify-content:flex-start;gap:14px} .flowbar .path button{flex:0 0 auto} .flowbar .path button[aria-current] span{margin-right:6px}
.wbtns{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px} .wbtns button,.flowfoot button,.rbtns button{border-radius:6px;padding:8px 14px;cursor:pointer;font:inherit;font-size:13px}
.wbtns .pri,.flowfoot .pri,.rbtns .pri{background:var(--accent);color:#1a1212;border:0;font-weight:600} .wbtns .sec,.flowfoot .sec{background:transparent;border:1px solid var(--line-2);color:var(--fg)}
.flowfoot .pri[disabled]{background:var(--line-2);color:var(--muted);cursor:default}
#wList{margin:4px 0 10px}
.flowbar{margin:0 0 10px} .flowbar .fsub{font-size:12px;color:var(--muted);margin:2px 0 0}
.path button .pl{display:none}
.path button[disabled]{color:var(--faint);cursor:default;opacity:.6}
.flowfoot{position:sticky;bottom:-40px;z-index:4;display:flex;justify-content:space-between;align-items:center;gap:8px;margin:24px -18px -40px;padding:12px 18px 16px;background:var(--panel);border-top:1px solid var(--line)}
.flowfoot button{max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.flow #side .next, body.flow #side .tabs, body.flow #side .ctx, body.flow #side p:has(> #toPrec), body.flow #side .examples{display:none}
.rbtns{display:flex;gap:8px;margin:6px 0 4px}
.report h2.rg{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-2);font-weight:600;margin:26px 0 4px;padding-top:12px;border-top:1px solid var(--line)}
.report h3{font-size:14px;letter-spacing:0;text-transform:none;color:var(--fg);font-weight:400;border-top:0;margin:14px 0 4px;padding-top:0}
.report .rl{margin:0 0 6px;color:var(--fg)} dl.rd{grid-template-columns:minmax(120px,38%) 1fr;font-size:12.5px} dl.rd dt{color:var(--muted)} dl.rd dd{margin:0}
.report .rt{overflow-x:auto} .report table{font-size:12px} ul.rr{margin:4px 0;padding-left:18px;font-size:12.5px;color:var(--muted)}

/* how-it-works cards (explain.js) */
.xpbtn{display:inline-flex;gap:6px;align-items:center;background:transparent;border:1px solid var(--line-2);color:var(--fg);border-radius:999px;padding:5px 12px;font:inherit;font-size:12.5px;cursor:pointer;margin:2px 0 12px}
.xpbtn span{color:var(--accent-2)} .xpbtn:hover{border-color:var(--accent)}
#xp{position:fixed;inset:0;z-index:60;background:rgba(8,9,10,.78);display:flex;align-items:center;justify-content:center;padding:16px}
#xp[hidden]{display:none}
#xp .xcard{width:min(1120px,100%);max-height:calc(100% - 32px);overflow:auto;background:var(--panel);border:1px solid var(--line-2);border-radius:10px;padding:18px 22px 14px;box-shadow:0 18px 50px rgba(0,0,0,.5)}
#xp .xtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
#xp .xbody{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:22px;align-items:start}
#xp .xvis,#xp .xvis2{background:#17181a;border:1px solid var(--line);border-radius:8px;padding:10px;min-width:0} #xp .xvis2{margin:10px 0}
#xp .xvis svg,#xp .xvis2 svg{display:block;width:100%;height:auto;font-family:inherit}
#xp .xn{font-size:12px;color:var(--muted)} #xp h2{font-size:20px;font-weight:300;margin:2px 0 8px} #xp .xtext p{line-height:1.55;margin:0 0 10px}
#xp .xtable{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline dotted;font:inherit;font-size:12px;cursor:pointer;margin:4px 0}
#xp .xfoot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}

<div class="app">
<header>
  <h1>Beyond Data <span>the tool</span></h1>
  <div class="seg" role="group" aria-label="City"><button id="c-van" aria-pressed="true">Vancouver</button><button id="c-edm" aria-pressed="false">Edmonton</button></div>
  <div class="search"><input id="q" type="search" placeholder="Search an address" autocomplete="off" aria-label="Search an address" aria-controls="res"><ul id="res" class="results" role="listbox" hidden></ul></div>
  <select id="ask" aria-label="What brings you here?">
    <option value="design">What could go here?</option>
    <option value="evaluate">I have a proposal</option>
    <option value="load">Where could a data centre of this size go?</option>
    <option value="near">What would it mean near me?</option>
  </select>
  <div class="tb"><button id="zin" title="Zoom in" aria-label="Zoom in">+</button><button id="zout" title="Zoom out" aria-label="Zoom out">−</button><button id="home" title="Whole city" aria-label="Whole city">⌂</button></div>
</header>
<main>
  <div id="map"><canvas id="cv" aria-label="Map of parcels; zones shaded by whether a data centre is an allowed use"></canvas>
    <div class="status" id="st">Loading…</div>
    <div class="legend" id="lg"></div>
    <div class="scale" id="sc"></div>
  </div>
  <aside id="side" aria-live="polite"></aside>
</main>
</div>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>n==null?'—':Math.round(n).toLocaleString('en-CA');
const money=n=>n==null?'—':'$'+Math.round(n).toLocaleString('en-CA');
const SRC={
 van_s2:['Zoning and Development By-law, s. 2 (Bulk Data Storage)','https://bylaws.vancouver.ca/zoning/Sec02.pdf'],
 van_i2:['I-2 District Schedule','https://bylaws.vancouver.ca/zoning/zoning-by-law-district-schedule-I-2.pdf'],
 van_i1c:['I-1C District Schedule','https://bylaws.vancouver.ca/zoning/zoning-by-law-district-schedule-i-1c.pdf'],
 van_i3:['I-3 District Schedule (June 2026)','https://bylaws.vancouver.ca/zoning/zoning-by-law-district-schedule-i-3.pdf'],
 van_fc2:['FC-2 District Schedule (June 2026)','https://bylaws.vancouver.ca/zoning/zoning-by-law-district-schedule-fc-2.pdf'],
 van_cd1:['CD-1 by-laws','https://cd1-bylaws.vancouver.ca/'],
 van_landuse:['Land Uses by Zoning District (June 2026, reference only)','https://bylaws.vancouver.ca/zoning/land-uses-by-zoning-district.pdf'],
 van_rts:['Referral report RTS 19744, 111 E 5th Ave (14 Jul 2026)','https://council.vancouver.ca/20260714/documents/rr1.pdf'],
 van_data:['City of Vancouver Open Data: parcels, property tax report 2026, building footprints 2009','https://opendata.vancouver.ca/'],
 edm_matrix:['Land Use & Zoning Matrix (Oct 2026)','https://www.edmonton.ca/sites/default/files/public-files/Edmonton-Zoning-Bylaw-Land-Use-and-Zoning-Matrix.pdf'],
 edm_bl:['Zoning Bylaw 20001','https://www.edmonton.ca/sites/default/files/public-files/assets/Bylaws/Bylaw20001.pdf'],
 edm_dc:['City of Edmonton: Data Centre Development','https://www.edmonton.ca/business_economy/economic_investment/data-centre-development'],
 edm_data:['City of Edmonton Open Data: property assessment 2026, parcel points, zoning, rooflines','https://data.edmonton.ca/'],
 edm_lots:['Lot outlines: Alberta title mapping, © Altalis, via Edmonton Public Schools GIS (current to 1 Sep 2025); academic use','https://azimuth.epsb.ca/server/rest/services/Hosted/Titled_Lots_Current/FeatureServer/info/iteminfo?f=pjson'],
};
const srcs=ids=>'<div class="src">Sources: '+ids.map(i=>`<a href="${SRC[i][1]}" target="_blank" rel="noopener">${esc(SRC[i][0])}</a>`).join(' · ')+'</div>';

/* ---------- zoning rules (from research notes 17, 18; register) ---------- */
const VAN_ENV={
 'I-2':'Floor area up to 3.0 × the lot. Height 18.3 m (the City may allow 30.5–36.5 m). Rear yard 3.1 m. No data storage at the ground floor except entrances.',
 'I-1C':'Floor area up to 6.0 × the lot, at least a third of it industrial-type uses. Height 46.5 m (21.0 m near street edges; up to 50.3 m).',
 'I-3':'Only in sub-area A. Floor area up to 3.0 × the lot (the extra 2.0 does not apply to storage uses). Height 18.3 m (City may allow 30.5 m). Side yard 7.6 m, rear 3.1 m. Buildings at most 61 m wide and deep. Ground floor 6.0 m floor-to-floor; no data storage at the ground floor.',
 'FC-2':'Floor area from 1.0 to 5.0 × the lot depending on sub-area (6.5 at the City\'s discretion). Height 10.7–22.9 m (City may allow up to 51.8 m). No side yards. No data storage at grade.',
};
function vanStatus(z){
  z=(z||'').trim();
  if(VAN_ENV[z]) return {k:'case',t:'Case by case',d:`"Bulk Data Storage" is a conditional use in ${esc(z)}: the City decides on a development permit.`,env:VAN_ENV[z],src:['van_s2',{'I-2':'van_i2','I-1C':'van_i1c','I-3':'van_i3','FC-2':'van_fc2'}[z]]};
  if(/^CD-1/.test(z)) return {k:'site',t:'Site-specific',d:'Comprehensive Development zoning: this parcel has its own by-law. Read it to see whether a data centre is allowed; otherwise treat it as a rezoning.',src:['van_cd1']};
  if(!z||z==='?') return {k:'site',t:'No zoning recorded',d:'The tax record carries no zoning district for this parcel.',src:['van_data']};
  if(/^(DD|FCCDD|CWD|BCPED|DEOD)$/.test(z)) return {k:'site',t:'Not yet reviewed',d:'This area is governed by an Official Development Plan, which the research has not yet reviewed. Whether a data centre is allowed here is unknown in the tool for now.',src:['van_landuse']};
  const ref=/^(I-1|I-1A|I-1B|I-4|IC-|M-|MC-|C-|FC-1|R|RT|RM|RA|FM|FSD|HA)/.test(z);
  return {k:'no',t:'Rezoning needed',d:'"Bulk Data Storage" is not listed for this district'+(ref?' in the City\'s land-use table (a reference document; the district schedule governs)':'')+'. A data centre here would need a rezoning — the 111 E 5th Ave referral is the current test case.',src:['van_s2','van_landuse','van_rts']};
}
const EDM_ENV={
 IH:'Height 30.0 m (the City may vary it for operating features). Floor area up to 2.0 × the lot. Minimum site 1.0 ha. Street setback 3.0 m.',
 IM:'Height 18.0 m. Floor area up to 2.0 × the lot. Setbacks 3.0 m from a street, 6.0 m next to a non-industrial zone, none to other industrial lots.',
 BE:'Height 16.0 m. Floor area up to 1.6 × the lot. Setbacks 6.0 m from a street (4.5 m on a collector or local road), 6.0 m next to a residential zone, none to other sites or alleys.',
};
function edmStatus(zraw){
  const z=String(zraw||'').trim().split(/\s+/)[0].toUpperCase();
  const minorNote='A large data centre is treated by the City as Major Industrial. A smaller one whose noise, emissions and fuel or battery hazards stay inside the site could be argued as Minor Industrial — the Development Planner decides.';
  if(z==='IH') return {k:'yes',t:'Allowed',d:'Major Industrial is a permitted use in IH, which is where the City says large-scale data centres belong.',env:EDM_ENV.IH,src:['edm_matrix','edm_bl','edm_dc']};
  if(z==='IM') return {k:'case',t:'Smaller only',d:'Minor Industrial is permitted; Major Industrial only where it existed on 1 January 2024. '+minorNote+' A large data centre here needs a rezoning to IH.',env:EDM_ENV.IM,src:['edm_matrix','edm_bl','edm_dc']};
  if(z==='BE') return {k:'case',t:'Smaller only',d:'Minor Industrial is permitted in BE; Major Industrial is not. '+minorNote,env:EDM_ENV.BE,src:['edm_matrix','edm_dc']};
  // verification sweep 17 Oct (C3), checked against Bylaw 20001 s. 2.210 and Appendix IV: UI's permitted uses list no industrial use
  if(z==='UI') return {k:'no',t:'Rezoning needed',d:'No industrial use is permitted in UI. Minor Industrial appears only on the NAIT Main Campus (Appendix IV, Sub-Area 2), and there only as storage. A data centre here would need a rezoning.',src:['edm_bl','edm_dc']};
  // FD s. 2.240: Minor Industrial only as temporary outdoor storage, no permanent structures
  if(z==='FD') return {k:'no',t:'Rezoning needed',d:'In Future Urban Development, Minor Industrial is limited to temporary outdoor storage with no permanent structures, so a data centre would need a rezoning.',src:['edm_bl']};
  if(/^DC/.test(z)) return {k:'site',t:'Site-specific',d:'Direct Control: this site has its own provisions. Read them to see what is allowed; otherwise treat it as a rezoning.',src:['edm_bl']};
  const STD=['RS','RSF','RSM','RM','RL','RR','MUN','MU','CN','CG','CB','A','NA','PSN','PS','PU','AG'];
  if(!STD.includes(z)) return {k:'site',t:'Special area',d:'A special area or legacy zone ('+esc(z)+') with its own use lists; these are not yet loaded into the tool.',src:['edm_bl']};
  return {k:'no',t:'Rezoning needed',d:'No industrial use is listed in this standard zone. A data centre here would need a rezoning, sometimes a plan amendment, and a Council public hearing.',src:['edm_matrix','edm_dc']};
}
const COL={yes:['rgba(134,173,167,.42)','#86ada7'],case:['rgba(205,176,122,.30)','#cdb07a'],site:['rgba(157,154,148,.16)','#6b6964'],low:['rgba(120,132,150,.13)','#4b5361'],no:[null,'#30343a']};
// small-scale housing zones (J.B., 16 Oct): a distinct tint, still selectable. Vancouver R1-1 and RT- districts; Edmonton RS, RSF, RR (Bylaw 20001)
const LOWD={van:/^(R1-1|RT-\d+[A-Z]?)$/, edm:/^(RS|RSF|RR)$/};
const lowD=(city,z)=>LOWD[city].test(String(z||'').trim().split(/\s+/)[0].toUpperCase());

/* ---------- state ---------- */
const S={city:'van',meta:{},tiles:{},loading:{},sel:null,view:null,answers:{built:'new',extent:'whole',floor:'',host:{}}};
const cv=$('#cv'), ctx=cv.getContext('2d'), mapEl=$('#map');
let W=0,H=0,DPR=1;

function decodeRing(a,ox,oy,q){ const n=a.length/2, r=new Float64Array(a.length); let x=0,y=0;
  for(let i=0;i<n;i++){ x+=a[2*i]; y+=a[2*i+1]; r[2*i]=ox+x/q; r[2*i+1]=oy+y/q; } return r; }
function bbox(r){ let a=1e9,b=1e9,c=-1e9,d=-1e9; for(let i=0;i<r.length;i+=2){ const x=r[i],y=r[i+1]; if(x<a)a=x; if(y<b)b=y; if(x>c)c=x; if(y>d)d=y; } return [a,b,c,d]; }
function pathOf(rings){ const p=new Path2D(); for(const r of rings){ p.moveTo(r[0],r[1]); for(let i=2;i<r.length;i+=2) p.lineTo(r[i],r[i+1]); p.closePath(); } return p; }
function pip(x,y,r){ let c=false; for(let i=0,j=r.length-2;i<r.length;j=i,i+=2){ const xi=r[i],yi=r[i+1],xj=r[j],yj=r[j+1]; if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi)) c=!c; } return c; }
function area(r){ let s=0; for(let i=0,j=r.length-2;i<r.length;j=i,i+=2) s+=(r[j]+r[i])*(r[j+1]-r[i+1]); return Math.abs(s/2); }
function centroid(r){ let x=0,y=0,n=r.length/2; for(let i=0;i<r.length;i+=2){x+=r[i];y+=r[i+1];} return [x/n,y/n]; }
const statusOf=z=>S.city==='van'?vanStatus(z):edmStatus(z);

async function getJSON(u){ const r=await fetch(u); if(!r.ok) throw new Error(u+' '+r.status); return r.json(); }
async function loadMeta(city){
  if(S.meta[city]) return S.meta[city];
  const m=await getJSON(`tiles/${city}/meta.json`);
  m.zstat=m.zones.map(z=>{ const k=(city==='van'?vanStatus(z):edmStatus(z)).k; return k==='no'&&lowD(city,z)?'low':k; });
  const by={yes:[],case:[],site:[],low:[],no:[]};
  for(const [zi,a] of m.overview){ by[m.zstat[zi]].push(decodeRing(a,0,0,m.Q)); }
  m.ov={}; for(const k in by) m.ov[k]=pathOf(by[k]);
  m.ovRaw=m.overview.map(([zi,a])=>{const r=decodeRing(a,0,0,m.Q);return {zi,r,bb:bbox(r)};}); delete m.overview;
  m.tileset=new Set(m.tiles.map(t=>t[0]+'_'+t[1]));
  m.fl=(m.flood||[]).map(([cat,rs])=>{const rings=rs.map(a=>decodeRing(a,0,0,m.Q)); return {cat,rings,bb:bbox(rings[0]),path:pathOf(rings)};}); delete m.flood;
  S.meta[city]=m; if(window.BD&&BD.loadRecv) BD.loadRecv(city); return m;
}
async function loadTile(city,key){
  const id=city+':'+key; if(S.tiles[id]) return S.tiles[id]; if(S.loading[id]) return S.loading[id];
  S.loading[id]=getJSON(`tiles/${city}/t_${key}.json`).then(async t=>{
    const m=S.meta[city], q=m.Q, [ox,oy]=t.o;
    const T={key,A:t.A,par:[],pts:[],bld:[]};
    if(t.P) for(const [pid,a] of t.P){ const r=decodeRing(a,ox,oy,q); T.par.push({id:pid,r,bb:bbox(r)}); }
    // Edmonton lot outlines: Alberta title mapping (c) Altalis, via Edmonton Public Schools GIS; academic use (separate files, not in git)
    if(city==='edm'){ try{ const l=await getJSON(`tiles/edm/l_${key}.json`); const [lx,ly]=l.o; l.L.forEach(([a,ids],n)=>{ const r=decodeRing(a,lx,ly,q); T.par.push({id:'L'+key+'_'+n,r,bb:bbox(r),ids}); }); }catch(e){} }
    if(t.E) for(const [pid,x,y] of t.E) T.pts.push({id:pid,x:ox+x/q,y:oy+y/q});
    for(const [h,a,f] of t.B){ const r=decodeRing(a,ox,oy,q); let hh=h, ff=f||0; if(city==='edm'&&ff===0&&h>40){ ff=6; hh=4; } /* M70: an unmeasured estimate over 40 m (up to 280 m on sheds) is not trusted: height not known, drawn one storey */ T.bld.push({h:hh,r,f:ff,c:centroid(r),a:area(r),hEst:ff===6?h:undefined}); }
    T.pPath=pathOf(T.par.map(p=>p.r)); T.bPath=pathOf(T.bld.filter(b=>b.f!==3).map(b=>b.r)); T.gPath=pathOf(T.bld.filter(b=>b.f===3).map(b=>b.r));
    S.tiles[id]=T; delete S.loading[id]; draw(); return T;
  }).catch(e=>{ delete S.loading[id]; console.warn(e); });
  return S.loading[id];
}

/* ---------- view ---------- */
function resize(){ const b=mapEl.getBoundingClientRect(); DPR=Math.min(window.devicePixelRatio||1,2); W=b.width; H=b.height; cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); draw(); }
function homeView(){ const m=S.meta[S.city]; const [a,b,c,d]=m.ext; const s=Math.min(W/(c-a),H/(d-b))*0.95; S.view={cx:(a+c)/2,cy:(b+d)/2,s,auto:true}; }
// the canvas bitmap must match the map's size; if the page opened at a small or zero size (e.g. a frame still laying out), fix it at paint time
function syncSize(){ const cw=mapEl.clientWidth, ch=mapEl.clientHeight, d=Math.min(window.devicePixelRatio||1,2); if(cw<2||ch<2) return false;
  if(Math.abs(cw-W)>0.5||Math.abs(ch-H)>0.5||d!==DPR||cv.width!==Math.round(cw*d)||cv.height!==Math.round(ch*d)){ W=cw; H=ch; DPR=d; cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); if(S.view&&S.view.auto&&S.meta[S.city]) homeView(); }
  return true; }
const toWorld=(px,py)=>[S.view.cx+(px-W/2)/S.view.s, S.view.cy-(py-H/2)/S.view.s];
const DETAIL={van:0.12,edm:0.2};
function visibleTiles(){ const m=S.meta[S.city], T=m.T; const [x0,y1]=toWorld(0,0),[x1,y0]=toWorld(W,H); const out=[];
  for(let i=Math.floor(x0/T);i<=Math.floor(x1/T);i++) for(let j=Math.floor(y0/T);j<=Math.floor(y1/T);j++){ const k=i+'_'+j; if(m.tileset.has(k)) out.push(k); } return out; }
let raf=0; function draw(){ if(!raf) raf=requestAnimationFrame(()=>{raf=0; paint();}); }
function paint(){
  const m=S.meta[S.city]; if(!m||!S.view) return;
  if(!syncSize()){ setTimeout(draw,100); return; }
  const {cx,cy,s}=S.view;
  ctx.setTransform(DPR,0,0,DPR,0,0); ctx.fillStyle='#17181a'; ctx.fillRect(0,0,W,H);
  ctx.setTransform(s*DPR,0,0,-s*DPR,(W/2-cx*s)*DPR,(H/2+cy*s)*DPR);
  const lw=px=>px/s;
  const fa=s>=DETAIL[S.city]?0.4:1;
  for(const k of ['no','low','site','case','yes']){ const [f,st]=COL[k]; if(f){ ctx.globalAlpha=fa; ctx.fillStyle=f; ctx.fill(m.ov[k],'evenodd'); ctx.globalAlpha=1; } if(S.city==='edm'||s<DETAIL[S.city]){ ctx.strokeStyle=k==='no'?'#26292e':st; ctx.lineWidth=lw(k==='no'?.5:.8); ctx.stroke(m.ov[k]); } }
  const detail=s>=DETAIL[S.city];
  if(detail){
    const keys=visibleTiles(); let waiting=0;
    for(const k of keys){ const T=S.tiles[S.city+':'+k]; if(!T){ waiting++; loadTile(S.city,k); continue; }
      if(T.par.length){ ctx.strokeStyle='#4a4f57'; ctx.lineWidth=lw(.6); ctx.stroke(T.pPath); }
      ctx.fillStyle='rgba(233,230,225,.07)'; ctx.fill(T.bPath); ctx.strokeStyle='rgba(233,230,225,.38)'; ctx.lineWidth=lw(.7); ctx.stroke(T.bPath); if(T.gPath){ ctx.setLineDash([3/s,3/s]); ctx.strokeStyle='rgba(233,230,225,.18)'; ctx.stroke(T.gPath); ctx.setLineDash([]); }
      if(T.pts.length && s>0.6){ ctx.fillStyle='#9d9a94'; const r=lw(1.6); for(const p of T.pts) ctx.fillRect(p.x-r,p.y-r,2*r,2*r); }
    }
    $('#st').textContent=waiting?`Loading ${waiting} area${waiting>1?'s':''}…`:'Click a parcel';
  } else $('#st').textContent='Zoom in or search an address to pick a parcel';
  if(detail&&m.fl&&m.fl.length){ ctx.setLineDash([6/s,4/s]); for(const f of m.fl){ if(f.cat==='wave') continue; ctx.strokeStyle=f.cat==='designated'?'rgba(127,178,196,.85)':'rgba(127,178,196,.45)'; ctx.lineWidth=lw(f.cat==='designated'?1.4:.9); ctx.stroke(f.path); } ctx.setLineDash([]); }
  if(window.BD&&BD.paintRecv) BD.paintRecv(ctx,s,lw);
  if(S.sel&&S.sel.city===S.city){ ctx.strokeStyle='#CC746C'; ctx.lineWidth=lw(2.4);
    if(S.sel.ring){ ctx.stroke(pathOf([S.sel.ring])); }
    if(S.sel.pt){ const r=lw(7); ctx.beginPath(); ctx.arc(S.sel.pt[0],S.sel.pt[1],r,0,7); ctx.stroke(); }
    if(S.sel.blds){ ctx.fillStyle='rgba(204,116,108,.22)'; ctx.fill(pathOf(S.sel.blds.map(b=>b.r))); }
  }
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const nice=[10,20,50,100,200,500,1000,2000,5000]; const target=110/s; const L=nice.find(v=>v>=target)||5000;
  $('#sc').innerHTML=`${L>=1000?L/1000+' km':L+' m'}<b style="width:${Math.round(L*s)}px;margin-left:auto"></b>`;
}

     ['heat','How is it heated?',[['hydronic','Hot-water system'],['gas','Gas boilers'],['elec','Electric baseboard'],['de','District energy'],['dk',"Don't know"]]],
     ['walls','Does the space touch an outside wall?',[['yes','Yes'],['no','No'],['dk',"Don't know"]]]]
    .map(([k,l,o])=>`<div style="margin-top:10px"><div class="sub" style="margin-bottom:4px">${esc(l)}</div><div class="chips" data-h="${k}">${o.map(([v,t])=>`<button data-v="${v}" aria-pressed="${(A.host[k]||'')===v}">${esc(t)}</button>`).join('')}</div></div>`).join('')+
    `<small style="margin-top:8px">More (room for heat rejection, electrical service, floor height, floor strength) sits in "Specify the building" for operators and planners.</small></div>`;
  }
  h+=`<div class="q"><div class="sub">Or a special case: <a href="#" data-sp="modular">a modular unit</a> · <a href="#" data-sp="infra">beside existing infrastructure</a> · <a href="#" data-sp="expand">expanding an existing data centre</a></div>${A.special?`<small>Chosen: ${esc({modular:'a modular or containerised unit',infra:'at existing infrastructure (substation, sewage plant, district energy plant, telecom exchange)',expand:'expanding an existing data centre'}[A.special])} — <a href="#" data-sp="">clear</a></small>`:''}</div>
  <div class="next"><button id="fits">What fits here →</button><span class="sub">The envelope, room for servers and plant, and the largest size that fits.</span></div>
  `;
  return h;
}

/* ---------- address search ---------- */
const shards={};
async function shard(city,k){ const id=city+k; if(!shards[id]) shards[id]=fetch(`tiles/${city}/s_${k}.tsv`).then(r=>r.ok?r.text():'').then(t=>t?t.split('\n').map(l=>l.split('\t')):[]); return shards[id]; }
let qTimer=0;
$('#q').addEventListener('input',()=>{ clearTimeout(qTimer); qTimer=setTimeout(search,180); });
$('#q').addEventListener('keydown',e=>{ const items=[...document.querySelectorAll('#res li[data-i]')]; if(!items.length) return; let i=items.findIndex(li=>li.getAttribute('aria-selected')==='true');
  if(e.key==='ArrowDown'){ e.preventDefault(); i=Math.min(items.length-1,i+1); } else if(e.key==='ArrowUp'){ e.preventDefault(); i=Math.max(0,i-1); } else if(e.key==='Enter'){ e.preventDefault(); (items[i]||items[0]).click(); return; } else return;
  items.forEach((li,j)=>li.setAttribute('aria-selected',j===i)); });
const ABBR={AVENUE:'AVE',STREET:'ST',WEST:'W',EAST:'E',NORTH:'N',SOUTH:'S',NORTHWEST:'NW',SOUTHWEST:'SW',NORTHEAST:'NE',SOUTHEAST:'SE',ROAD:'RD',DRIVE:'DR',BOULEVARD:'BLVD',CRESCENT:'CRES',PLACE:'PL',COURT:'CRT',TRAIL:'TR',LANE:'LN',WAY:'WY'};
const normTok=t=>ABBR[t]||t;
const toks=s=>s.toUpperCase().replace(/[.,#]/g,' ').split(/\s+/).filter(Boolean).map(normTok);
async function search(){
  const v=$('#q').value.trim(); const res=$('#res');
  if(v.length<3){ res.hidden=true; return; }
  const q=toks(v); const k=/^\d/.test(q[0])?q[0][0]:'x'; const rows=await shard(S.city,k);
  const num=/^\d/.test(q[0])?q[0]:null, words=num?q.slice(1):q, seen=new Set();
  const streetOK=t=>words.every(w=>t.some(x=>x.startsWith(w)));
  const hits=[]; for(const r of rows){ if(!r._t) r._t=toks(r[0]); const t=r._t;
    if(num&&t[0]!==num&&!(q.length===1&&t[0].startsWith(num))) continue;
    if(streetOK(t)&&!seen.has(r[0])){ seen.add(r[0]); hits.push(r); if(hits.length>=8) break; } }
  let note='';
  if(!hits.length&&num&&words.length){ const n=+num, all=[];
    for(const k2 of '123456789'){ for(const r of await shard(S.city,k2)){ if(!r._t) r._t=toks(r[0]); if(streetOK(r._t.slice(1))&&!seen.has(r[0])){ seen.add(r[0]); all.push([Math.abs(+r._t[0]-n),r]); } } }
    all.sort((a,b)=>a[0]-b[0]); for(const [,r] of all.slice(0,5)) hits.push(r);
    if(hits.length) note=`<li class="none">No ${esc(v)} in the City's ${S.city==='van'?'tax':'assessment'} records — the address may belong to a larger lot under another number. Nearest on that street:</li>`; }
  res.innerHTML=hits.length?note+hits.map((r,i)=>`<li role="option" data-i="${i}" aria-selected="${i===0}">${esc(r[0])}</li>`).join(''):`<li class="none">No match in ${S.city==='van'?'Vancouver':'Edmonton'} — try the number and street, e.g. ${S.city==='van'?'"555 W Hastings"':'"10220 104 Ave"'}</li>`;
  res.hidden=false;
  res.querySelectorAll('li[data-i]').forEach(li=>li.onclick=()=>{ const r=hits[+li.dataset.i]; res.hidden=true; $('#q').value=r[0]; select({city:S.city,tile:r[1],id:r[2]}); });
}
document.addEventListener('click',e=>{ if(!e.target.closest('.search')) $('#res').hidden=true; });
